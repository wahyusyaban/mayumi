<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- CLAYMORPHISM CSS -->
    <style>
        :root {
            /* Palet Warna Ekstrak dari Gambar */
            --bg-color: #d1d5db;       /* Abu-abu Latar Belakang */
            --card-bg: #faedd6;        /* Krem / Peach untuk Kartu */
            
            --clay-orange: #ed7d31;    /* Oranye Bar Bawah */
            --clay-yellow: #ffdf8c;    /* Kuning Icon */
            --clay-green: #90d3b6;     /* Hijau Pastel */
            --clay-red: #f48074;       /* Merah Pastel */
            --clay-text: #475569;      /* Teks Gelap */
            
            --shadow-light: #ffffff;
            --shadow-dark: #a1a5b0;
        }

        body { 
            background-color: var(--bg-color); 
            font-family: 'Fredoka', sans-serif;
            color: var(--clay-text);
            -webkit-tap-highlight-color: transparent;
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* --- CLAY UI COMPONENTS --- */
        
        .clay-card {
            background-color: var(--card-bg);
            border-radius: 1.25rem;
            box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light), 
                        inset 2px 2px 6px rgba(255,255,255,0.9), inset -2px -2px 6px rgba(0,0,0,0.03);
            border: 1px solid rgba(255,255,255,0.4);
        }

        .clay-panel {
            background-color: var(--bg-color);
            border-radius: 1rem;
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
        }

        .clay-btn {
            background-color: var(--card-bg);
            border-radius: 9999px;
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light), 
                        inset 2px 2px 4px rgba(255,255,255,1), inset -2px -2px 4px rgba(0,0,0,0.05);
            color: var(--clay-text);
            transition: all 0.15s ease;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .clay-btn:active {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px rgba(255,255,255,0.7);
            transform: scale(0.97);
        }

        .clay-btn-orange {
            background-color: var(--clay-orange);
            color: white;
            border-radius: 9999px;
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light), 
                        inset 2px 2px 5px rgba(255,255,255,0.4), inset -2px -2px 5px rgba(0,0,0,0.15);
            transition: all 0.15s ease;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .clay-btn-orange:active {
            box-shadow: inset 4px 4px 8px rgba(0,0,0,0.2), inset -4px -4px 8px rgba(255,255,255,0.2);
            transform: scale(0.97);
        }

        .clay-box-yellow {
            background-color: var(--clay-yellow);
            border-radius: 0.75rem;
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light), 
                        inset 2px 2px 5px rgba(255,255,255,0.8), inset -2px -2px 5px rgba(0,0,0,0.1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #a34c00;
        }

        .clay-badge-orange {
            background-color: var(--clay-orange);
            color: white;
            border-radius: 9999px;
            box-shadow: 2px 2px 4px var(--shadow-dark), -2px -2px 4px var(--shadow-light), 
                        inset 1px 1px 2px rgba(255,255,255,0.4), inset -1px -1px 2px rgba(0,0,0,0.1);
            padding: 0.25rem 0.75rem;
            font-size: 0.65rem;
            font-weight: 800;
        }

        .clay-badge-green {
            background-color: var(--clay-green);
            color: #0b513c;
            border-radius: 9999px;
            box-shadow: 2px 2px 4px var(--shadow-dark), -2px -2px 4px var(--shadow-light), 
                        inset 1px 1px 2px rgba(255,255,255,0.6), inset -1px -1px 2px rgba(0,0,0,0.1);
            padding: 0.25rem 0.75rem;
            font-size: 0.65rem;
            font-weight: 800;
        }

        .clay-input {
            background-color: var(--card-bg);
            border: none;
            border-radius: 1rem;
            box-shadow: inset 4px 4px 8px rgba(0,0,0,0.1), inset -4px -4px 8px rgba(255,255,255,1);
            padding: 0.75rem 1rem;
            width: 100%;
            color: var(--clay-text);
            font-weight: 700;
            transition: all 0.2s ease;
        }
        .clay-input:focus {
            outline: none;
            box-shadow: inset 6px 6px 12px rgba(0,0,0,0.15), inset -6px -6px 12px rgba(255,255,255,1), 0 0 0 2px rgba(237,125,49,0.3);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ==========================================
        //         SUPABASE CONFIGURATION
        // ==========================================
        const SUPABASE_URL = 'https://mhbyivcjcnndqogjgzxb.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1oYnlpdmNqY25uZHFvZ2pnenhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5NTY0NzUsImV4cCI6MjEwMTUzMjQ3NX0.rAeV91oayf6BdbBP6vZL7AYxfhTXBkM9_yWuJcgaB7M';  
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- ICONS ---
        const Icon = ({ name, size = 24, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current) {
                    iconRef.current.innerHTML = `<i data-lucide="${name}" width="${size}" height="${size}"></i>`;
                    lucide.createIcons();
                }
            }, [name, size]);
            return <span ref={iconRef} className={`inline-flex items-center justify-center ${className}`}></span>;
        };

        // --- DATA FALLBACK ---
        const DEFAULT_PRODUCTS = [
            { id: 1, name: 'Coklat keju', price: 15000, label: '14K', imgId: '🍫' },
            { id: 2, name: 'Coklat parut keju', price: 15000, label: '14K', imgId: '🧀' },
            { id: 3, name: 'Coklat', price: 13000, label: '12K', imgId: '🍫' },
            { id: 4, name: 'Tiramisu', price: 13000, label: '12K', imgId: '🍰' },
            { id: 5, name: 'Matcha', price: 13000, label: '12K', imgId: '🍵' },
            { id: 6, name: 'Gula aren', price: 12000, label: '10K', imgId: '🍯' },
            { id: 7, name: 'Bebas mix', price: 13000, label: '12K', desc: '(Mix 2 varian)', imgId: '🍪' },
            { id: 8, name: 'Keju mix', price: 14000, label: '14K', desc: '(Mix 1 varian & Keju)', imgId: '🧀' },
        ];

        // --- UTILS ---
        const formatRp = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num);
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; const dLat = (lat2 - lat1) * Math.PI / 180; const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        // --- CUTE MODAL ALERT ---
        const CuteModal = ({ config, onClose }) => {
            if (!config) return null;
            return (
                <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-[200] flex items-center justify-center p-4">
                    <div className="clay-card p-6 max-w-xs w-full text-center">
                        <div className="text-6xl mb-3 animate-bounce drop-shadow-md">{config.emoji || '🥺'}</div>
                        <h3 className="font-bold text-gray-800 mb-6 leading-tight">{config.message}</h3>
                        <div className="flex gap-3">
                            {config.onConfirm && <button onClick={onClose} className="clay-btn flex-1 py-3">Batal</button>}
                            <button onClick={() => { if(config.onConfirm) config.onConfirm(); onClose(); }} className={`flex-1 py-3 ${config.onConfirm ? 'clay-btn-orange' : 'clay-btn'}`}>
                                {config.onConfirm ? 'Ya, Hapus!' : 'Okee!'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            const [role, setRole] = useState('user'); 
            const [products, setProducts] = useState(DEFAULT_PRODUCTS);
            const [orders, setOrders] = useState([]);
            const [reviews, setReviews] = useState([]);
            const [settings, setSettings] = useState({ storeLat: -6.2088, storeLon: 106.8456, costPerKm: 1000 });
            const [isKeyboardOpen, setIsKeyboardOpen] = useState(false);
            const [showPinModal, setShowPinModal] = useState(false);
            const [pinInput, setPinInput] = useState('');
            const [isCheckingPin, setIsCheckingPin] = useState(false);
            const [alertConfig, setAlertConfig] = useState(null);
            
            const showAlert = (message, emoji, onConfirm = null) => setAlertConfig({ message, emoji, onConfirm });
            const closeAlert = () => setAlertConfig(null);

            useEffect(() => {
                const fetchData = async () => {
                    try {
                        const { data: prodData } = await supabase.from('products').select('*').order('id', { ascending: true });
                        if (prodData && prodData.length > 0) setProducts(prodData);
                        const { data: setData } = await supabase.from('settings').select('*').eq('id', 1).single();
                        if (setData) setSettings(setData);
                        const { data: ordData } = await supabase.from('orders').select('*').order('date', { ascending: false });
                        if (ordData) setOrders(ordData);
                        const { data: revData } = await supabase.from('reviews').select('*').order('created_at', { ascending: false });
                        if (revData) setReviews(revData);
                    } catch (error) {}
                };
                fetchData();
            }, []);

            useEffect(() => {
                const handleFocusIn = (e) => { if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) setIsKeyboardOpen(true); };
                const handleFocusOut = () => setIsKeyboardOpen(false);
                const handleResize = () => {
                    if (window.innerHeight < 500) setIsKeyboardOpen(true);
                    else if (!document.activeElement || !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) setIsKeyboardOpen(false);
                };
                document.addEventListener('focusin', handleFocusIn); document.addEventListener('focusout', handleFocusOut); window.addEventListener('resize', handleResize);
                return () => { document.removeEventListener('focusin', handleFocusIn); document.removeEventListener('focusout', handleFocusOut); window.removeEventListener('resize', handleResize); };
            }, []);

            const handlePinSubmit = async () => {
                if (!pinInput) return;
                setIsCheckingPin(true);
                try {
                    const { data, error } = await supabase.auth.signInWithPassword({ email: 'admin@pisangmayumi.com', password: pinInput });
                    if (error) throw error;
                    if (data.session) { setRole('admin'); setShowPinModal(false); setPinInput(''); }
                } catch (error) {
                    showAlert('Oops! PIN-nya salah nih. Coba inget-inget lagi yaa 🍌', '🙈'); setPinInput('');
                } finally { setIsCheckingPin(false); }
            };

            return (
                <div className={`min-h-screen max-w-md mx-auto relative ${isKeyboardOpen ? 'pb-4' : 'pb-24'}`}>
                    
                    {/* Header Lengket - Style Island */}
                    <header className={`px-4 pt-4 pb-2 z-40 ${isKeyboardOpen ? '' : 'sticky top-0 bg-[var(--bg-color)]'}`}>
                        <div className="clay-card p-4 flex justify-between items-center relative overflow-hidden">
                            <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhxV6yhpL_k0ZhI70PRISUNtvNB4oFayGkZaKOhJ0Vv2bXd_BoeVraa43uLF3lGr-UkuamsS4Ra5STvSXibU-XoSBf_Vz2AmDbUhvbjsT2OXAiQy5B4_lecTnXd4BqKkiq4pa-aNhmsKROrnliATN07hzvpeNexsfK1_lqPdrEx9WgQShMN7JxV4rXHgPob/s500/file_00000000f3408230ab45d1aa7623b404-removebg-preview.png" 
                                 alt="Maskot" className="h-14 w-auto absolute right-2 opacity-90 drop-shadow-[0_5px_5px_rgba(0,0,0,0.15)] pointer-events-none" />
                            <div>
                                <h1 className="text-2xl font-black tracking-wide leading-none text-gray-800">
                                    Pisang Kembung
                                </h1>
                                <span className="clay-badge-green bg-var(--clay-green) mt-1 inline-block transform -rotate-2 border border-white">Mayumi</span>
                            </div>
                        </div>
                    </header>

                    <main className="px-4 py-2 relative z-0">
                        {role === 'user' 
                            ? <UserView products={products} orders={orders} setOrders={setOrders} settings={settings} isKeyboardOpen={isKeyboardOpen} showAlert={showAlert} reviews={reviews} setReviews={setReviews} showPinModal={() => setShowPinModal(true)} /> 
                            : <AdminView orders={orders} setOrders={setOrders} settings={settings} setSettings={setSettings} products={products} setProducts={setProducts} showAlert={showAlert} setRole={setRole} />
                        }
                    </main>

                    {/* Modal PIN */}
                    {showPinModal && (
                        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                            <div className="clay-card p-6 max-w-sm w-full text-center">
                                <h3 className="font-black text-xl text-gray-800 mb-2">Akses Admin 🔒</h3>
                                <p className="text-xs text-gray-500 font-bold mb-5">Masukkan PIN rahasia untuk masuk</p>
                                <input type="password" value={pinInput} onChange={(e) => setPinInput(e.target.value)}
                                    className="clay-input text-center text-3xl tracking-[0.3em] mb-5 py-3" placeholder="••••" maxLength={12} />
                                <div className="flex gap-3">
                                    <button onClick={() => {setShowPinModal(false); setPinInput('');}} className="clay-btn flex-1 py-3">Batal</button>
                                    <button onClick={handlePinSubmit} disabled={isCheckingPin} className={`flex-1 py-3 flex justify-center items-center gap-2 ${isCheckingPin ? 'clay-btn text-gray-400' : 'clay-btn-orange'}`}>
                                        {isCheckingPin ? <Icon name="loader" size={18} className="animate-spin" /> : 'Masuk'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <CuteModal config={alertConfig} onClose={closeAlert} />
                </div>
            );
        };

        // ==========================================
        //               USER VIEW
        // ==========================================
        const UserView = ({ products, orders, setOrders, settings, isKeyboardOpen, showAlert, reviews, setReviews, showPinModal }) => {
            const [activeTab, setActiveTab] = useState('menu'); 
            const [cart, setCart] = useState([]);

            const addToCart = (product) => {
                const existing = cart.find(item => item.id === product.id);
                if (existing) setCart(cart.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item));
                else setCart([...cart, { ...product, qty: 1 }]);
            };
            const cartCount = cart.reduce((sum, item) => sum + item.qty, 0);

            return (
                <div>
                    {activeTab === 'menu' && <MenuTab products={products} onAdd={addToCart} />}
                    {activeTab === 'cart' && <CartTab cart={cart} setCart={setCart} settings={settings} setOrders={setOrders} onCheckoutSuccess={() => { setCart([]); setActiveTab('status'); }} showAlert={showAlert} />}
                    {activeTab === 'status' && <StatusTab orders={orders} showAlert={showAlert} />}
                    {activeTab === 'review' && <ReviewTab reviews={reviews} setReviews={setReviews} showAlert={showAlert} />}

                    {/* BOTTOM NAV FLOATING (DIAMOND) */}
                    {!isKeyboardOpen && (
                        <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto h-[4.5rem] bg-[#ed7d31] rounded-t-3xl shadow-[0_-10px_20px_rgba(0,0,0,0.15),_inset_0_4px_6px_rgba(255,255,255,0.3)] flex justify-between items-center px-4 z-50">
                            
                            <button onClick={() => setActiveTab('menu')} className={`flex flex-col items-center justify-center w-14 transition ${activeTab === 'menu' ? 'text-white' : 'text-orange-200'}`}>
                                <Icon name="store" size={24} className={activeTab === 'menu' ? 'fill-white/20' : ''} />
                                <span className="text-[9px] mt-1 font-black tracking-wide uppercase">Home</span>
                            </button>
                            
                            <button onClick={() => setActiveTab('status')} className={`flex flex-col items-center justify-center w-14 transition ${activeTab === 'status' ? 'text-white' : 'text-orange-200'}`}>
                                <Icon name="clipboard-list" size={24} className={activeTab === 'status' ? 'fill-white/20' : ''} />
                                <span className="text-[9px] mt-1 font-black tracking-wide uppercase">Antrean</span>
                            </button>
                            
                            {/* Tombol Tengah Berlian (Cart) */}
                            <div className="relative w-16 h-16 flex justify-center -top-6">
                                <button onClick={() => setActiveTab('cart')} className="absolute w-16 h-16 bg-[#ed7d31] rotate-45 rounded-[1.2rem] flex items-center justify-center shadow-[6px_6px_12px_rgba(0,0,0,0.2),_-2px_-2px_10px_rgba(255,255,255,0.4),_inset_2px_2px_4px_rgba(255,255,255,0.5),_inset_-2px_-2px_4px_rgba(0,0,0,0.1)] z-50 transition active:scale-95">
                                    <div className="w-11 h-11 bg-[#ffdf8c] -rotate-45 rounded-xl flex items-center justify-center shadow-[inset_2px_2px_4px_rgba(255,255,255,1),_inset_-2px_-2px_4px_rgba(0,0,0,0.1)] text-[#a34c00] relative">
                                        <Icon name="shopping-cart" size={20} className="fill-[#ffdf8c]" />
                                        {cartCount > 0 && <span className="absolute -top-3 -right-3 bg-[#f48074] text-white text-[10px] w-6 h-6 rounded-full flex items-center justify-center font-black border-2 border-[#ffdf8c] shadow-sm">{cartCount}</span>}
                                    </div>
                                </button>
                            </div>

                            <button onClick={() => setActiveTab('review')} className={`flex flex-col items-center justify-center w-14 transition ${activeTab === 'review' ? 'text-white' : 'text-orange-200'}`}>
                                <Icon name="star" size={24} className={activeTab === 'review' ? 'fill-white/20' : ''} />
                                <span className="text-[9px] mt-1 font-black tracking-wide uppercase">Customer</span>
                            </button>
                            
                            <button onClick={showPinModal} className="flex flex-col items-center justify-center w-14 transition text-orange-200">
                                <Icon name="menu" size={24} />
                                <span className="text-[9px] mt-1 font-black tracking-wide uppercase">Lainnya</span>
                            </button>
                        </nav>
                    )}
                </div>
            );
        };

        const MenuTab = ({ products, onAdd }) => {
            const [showMixModal, setShowMixModal] = useState(false);
            const [mixType, setMixType] = useState(''); 
            const [selectedFlavors, setSelectedFlavors] = useState([]);
            
            const baseFlavors = products.filter(p => !p.name.toLowerCase().includes('mix') && p.id !== 7 && p.id !== 8);
            const selectableMixFlavors = baseFlavors.filter(p => {
                const flavorName = p.name.toLowerCase();
                if (flavorName === 'coklat keju' || flavorName === 'coklat parut keju') return false;
                if (mixType === 'keju' && flavorName === 'coklat') return false;
                return true;
            });

            const handleProductClick = (p) => {
                if (p.id === 7 || p.name.toLowerCase().includes('bebas mix')) { setMixType('bebas'); setShowMixModal(true); setSelectedFlavors([]); } 
                else if (p.id === 8 || p.name.toLowerCase().includes('keju mix')) { setMixType('keju'); setShowMixModal(true); setSelectedFlavors([]); } 
                else { onAdd(p); }
            };

            const maxSelection = mixType === 'bebas' ? 2 : 1;
            const toggleFlavor = (flavorName) => {
                if (selectedFlavors.includes(flavorName)) setSelectedFlavors(selectedFlavors.filter(f => f !== flavorName));
                else if (selectedFlavors.length < maxSelection) setSelectedFlavors([...selectedFlavors, flavorName]);
            };

            const handleAddMix = () => {
                if (selectedFlavors.length === maxSelection) {
                    if (mixType === 'bebas') {
                        const mixP = products.find(p => p.id === 7) || { id: 7, name: 'Bebas mix', price: 12000, imgId: '🎭' };
                        onAdd({ ...mixP, id: `7-${selectedFlavors.join('-')}`, name: `Bebas mix (${selectedFlavors.join(' & ')})` });
                    } else if (mixType === 'keju') {
                        const mixP = products.find(p => p.id === 8) || { id: 8, name: 'Keju mix', price: 14000, imgId: '🧀' };
                        onAdd({ ...mixP, id: `8-${selectedFlavors[0]}`, name: `Keju mix (${selectedFlavors[0]} & Keju)` });
                    }
                    setShowMixModal(false);
                }
            };

            return (

        const CartTab = ({ cart, setCart, settings, setOrders, onCheckoutSuccess, showAlert }) => {

            const itemsTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0); 
            
            let distance = 0; let shippingCost = 0;
            if (userCoords) {
                distance = calculateDistance(settings.storeLat, settings.storeLon, userCoords.lat, userCoords.lon);
                shippingCost = Math.round((distance * settings.costPerKm) / 1000) * 1000; 
                if (shippingCost < 0 || totalQty >= 5) shippingCost = 0; 
            }
            const grandTotal = itemsTotal + shippingCost;

            const handleGetLocation = () => {
                setIsLoadingLoc(true);
                if ("geolocation" in navigator) {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => { setUserCoords({ lat: pos.coords.latitude, lon: pos.coords.longitude }); setIsLoadingLoc(false); },
                        (err) => { setUserCoords({ lat: settings.storeLat + 0.05, lon: settings.storeLon + 0.05 }); showAlert("Izin lokasi ditolak, simulasi lokasi aktif!", "😅"); setIsLoadingLoc(false); }, { timeout: 5000 }
                    );

            const handleCheckout = () => {
                if (!name || !phone) return showAlert("Eh tunggu! Nama & No HP belum diisi nih.", "🥺");

                setOrders(prev => [newOrder, ...prev]);
                const { error } = await supabase.from('orders').insert([newOrder]);
                if (error) showAlert("Gagal menyimpan pesanan ke server.", "😢");

                        </label>

                        <div className="flex justify-between text-xs mb-4 font-bold bg-black/40 p-3 rounded-xl text-gray-300">
                            <span className="flex items-center gap-2"><Icon name="truck" size={14}/> Ongkir {userCoords ? `(${distance.toFixed(1)}km)` : ''}</span>
                            <span>{userCoords ? formatRp(shippingCost) : "..."}</span>
                        </div>
                        <div className="flex justify-between font-black text-xl border-t border-gray-600 pt-4 mb-5"><span>TOTAL</span><span className="text-[#ffdf8c]">{userCoords ? formatRp(grandTotal) : "-"}</span></div>

                        </button>
                    </div>

                    {qrisModal && (
                        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4">

                                <h3 className="font-black text-xl text-gray-800">Scan QRIS 📱</h3>
                                <div className="clay-panel p-2 w-48 h-48 mx-auto flex items-center justify-center rounded-2xl">
                                    <img src='https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiect9TQ-Wq7KyuLLkJoRLwh2XaaxBNQDDkYs7uFGLsvkf9RDY5jq3Zer07dh8sAABT6s9sDzIRr_3mkw0GOkYKcYLJM_i-XZYl9l6vWa7KHrcchOSdLMGJaG4xCtqUCL0T1mjJ8S59ib9y_5VoFZvBN2eP9ba2M4z7KSeuWvUuaJj6XrcvKayQZrdnbVqF/s1200/qris.jpeg' className="w-full h-full object-cover rounded-xl" />
                                </div>
                                <p className="text-lg font-black text-[#ed7d31]">Total: {formatRp(grandTotal)}</p>
                                <div className="flex gap-2 pt-2">
                                    <button onClick={() => setQrisModal(false)} className="clay-btn flex-1 py-3 text-xs">Batal</button>
                                    <button onClick={() => { setQrisModal(false); processOrder(); }} className="clay-btn-orange flex-1 py-3 text-xs">Sudah Bayar</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const StatusTab = ({ orders, showAlert }) => {
            const [checkPhone, setCheckPhone] = useState(''); const [myOrders, setMyOrders] = useState([]);
            const [hasSearched, setHasSearched] = useState(false); const [isRefreshing, setIsRefreshing] = useState(false);

            const handleCek = async () => {
                if(!checkPhone) return showAlert('Ketik dulu dong nomor HP nya~', '📱');
                setIsRefreshing(true);
                try {
                    const { data, error } = await supabase.from('orders').select('*').eq('phone', checkPhone).order('date', { ascending: false });
                    if (error) throw error; setMyOrders(data || []); setHasSearched(true);
                } catch (error) { setMyOrders(orders.filter(o => o.phone === checkPhone).sort((a,b) => new Date(b.date) - new Date(a.date))); setHasSearched(true); } finally { setIsRefreshing(false); }
            };

            const getStatusBadge = (status) => {
                if (status === 'Selesai') return <span className="clay-badge-green border border-white">{status}</span>;
                if (status === 'Dibatalkan') return <span className="clay-badge-orange bg-[#f48074] border border-white">{status}</span>;
                return <span className="clay-badge-orange bg-gray-400 border border-white">{status}</span>;
            };

            const generateUserWaLink = (order) => {
                const text = `Hi kak, aku _${order.customerName}_, sudah pesan.\n\n*ID:* ${order.id}\n*Bayar:* ${formatRp(order.grandTotal)}`;
                return `https://wa.me/6285337513445?text=${encodeURIComponent(text)}`;
            };

            return (
                <div className="space-y-4 pt-2">
                    <div className="clay-card p-5 text-center relative overflow-hidden">

                            </button>

                    </div>

                    {hasSearched && (
                        <div className="space-y-4 mt-2">

                                <div className="text-center py-10 clay-panel"><span className="text-4xl mb-2 block opacity-50">🥺</span><p className="text-xs font-bold text-gray-500">Belum ada pesanan nih...</p></div>

                                                <span>Ongkir ({order.distance}km)</span><span>{formatRp(order.shippingCost)}</span>
                                            </div>
                                        </div>
                                        <div className="flex justify-between items-end mt-2">
                                            <p className="font-black text-sm text-[#ed7d31]">{formatRp(order.grandTotal)}</p>
                                            <a href={generateUserWaLink(order)} target="_blank" rel="noopener noreferrer" className="clay-btn px-4 py-2 text-[10px] text-gray-600 uppercase tracking-wider flex items-center gap-1">
                                                <Icon name="message-circle" size={12} /> WA Admin
                                            </a>
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const ReviewTab = ({ reviews, setReviews, showAlert }) => {
            const [showModal, setShowModal] = useState(false); const [name, setName] = useState('');
            const [rating, setRating] = useState(5); const [comment, setComment] = useState('');
            const [isSubmitting, setIsSubmitting] = useState(false);

            const handleSubmit = async () => {
                if(!name || !comment) return showAlert("Isi nama dan reviewnya dulu ya! 🥺", "🍰");
                setIsSubmitting(true);
                const newReview = { name, rating, comment, created_at: new Date().toISOString() };
                try {
                    const { data, error } = await supabase.from('reviews').insert([newReview]).select();
                    if(error) throw error;
                    if(data && data.length > 0) setReviews([data[0], ...reviews]); else setReviews([newReview, ...reviews]);
                    setShowModal(false); setName(''); setRating(5); setComment('');

            };

            return (

        // ==========================================
        //               ADMIN VIEW
        // ==========================================

                <div className="space-y-4 pt-2">

                        <button onClick={() => setTab('settings')} className={`flex-1 py-2 text-xs font-black uppercase tracking-wider ${tab === 'settings' ? 'clay-btn-orange' : 'clay-btn'}`}>Pengaturan</button>

                    </div>

            return (
                <div className="space-y-4">

                        <div key={order.id} className="clay-card p-4 relative">
                            <button onClick={() => handleDelete(order.id)} className="absolute top-4 right-4 clay-btn w-8 h-8 rounded-full text-red-400"><Icon name="trash-2" size={14} /></button>

                                <div className="text-right">
                                    <p className="font-black text-[#ed7d31] text-sm">{formatRp(order.grandTotal)}</p>
                                    <p className="text-[9px] text-gray-400 font-black mt-1 uppercase">{order.paymentMethod}</p>
                                </div>
                            </div>
                            <div className="clay-panel p-3 mb-3">
                                {order.items.map(item => <div key={item.id} className="text-[10px] font-black uppercase text-gray-600 mb-1"><span>{item.qty}x</span> {item.name}</div>)}
                            </div>
                            <select value={order.status} onChange={(e) => updateStatus(order.id, e.target.value)} className="clay-input text-xs text-center py-2">
                                {['Menunggu Konfirmasi', 'Pesanan Masuk', 'Sedang Diproses', 'Sedang Dikirim', 'Selesai', 'Dibatalkan'].map(opt => <option key={opt} value={opt}>{opt}</option>)}
                            </select>
                        </div>
                    ))}
                </div>
            );
        };

        const AdminSettings = ({ settings, setSettings, products, setProducts, showAlert }) => {
            const [localSet, setLocalSet] = useState(settings); const [localProducts, setLocalProducts] = useState(products);
            const [showProdModal, setShowProdModal] = useState(false); const [editForm, setEditForm] = useState(null);

            const handleSaveSettings = async () => {
                await supabase.from('settings').update({ storeLat: localSet.storeLat, storeLon: localSet.storeLon, costPerKm: localSet.costPerKm }).eq('id', 1);
                setSettings(localSet); showAlert('Pengaturan disimpan!', '🎉');
            };
            const handleDeleteProduct = (id) => { showAlert("Hapus menu ini?", "🗑️", async () => { const updatedList = localProducts.filter(p => p.id !== id); setLocalProducts(updatedList); setProducts(updatedList); await supabase.from('products').delete().eq('id', id); }); };
            const handleSaveProduct = async () => {
                if(!editForm.name || !editForm.price) return showAlert("Nama dan Harga wajib diisi!", "⚠️");
                const payload = { ...editForm, price: Number(editForm.price), label: Number(editForm.price) >= 1000 ? (Number(editForm.price)/1000)+'K' : editForm.price.toString() };
                await supabase.from('products').upsert([payload]);
                const sortedList = (localProducts.find(p => p.id === payload.id) ? localProducts.map(p => p.id === payload.id ? payload : p) : [...localProducts, payload]).sort((a,b) => a.id - b.id);
                setLocalProducts(sortedList); setProducts(sortedList); setShowProdModal(false);
            };

            return (
                <div className="space-y-4">
                    <div className="clay-card p-4">
                        <h2 className="font-black text-sm uppercase mb-3">Pengaturan Lokasi</h2>
                        <input type="number" value={localSet.costPerKm} onChange={(e) => setLocalSet({...localSet, costPerKm: Number(e.target.value)})} className="clay-input text-sm mb-2" placeholder="Tarif / Km" />
                        <button onClick={handleSaveSettings} className="w-full clay-btn-orange py-3 text-xs uppercase font-black mt-2">Simpan Lokasi</button>
                    </div>

                    <div className="clay-card p-4">
                        <h2 className="font-black text-sm uppercase mb-3">Kelola Menu</h2>
                        <div className="space-y-3 mb-4">
                            {localProducts.map(product => (
                                <div key={product.id} className="flex justify-between items-center clay-panel p-2">
                                    <div className="flex items-center gap-2">
                                        <div className="clay-box-yellow w-8 h-8 text-sm">{product.imgId}</div>
                                        <h4 className="font-black text-[10px] uppercase text-gray-700">{product.name}</h4>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={() => {setEditForm(product); setShowProdModal(true);}} className="clay-btn w-8 h-8 text-[#ed7d31]"><Icon name="edit-2" size={12} /></button>
                                        <button onClick={() => handleDeleteProduct(product.id)} className="clay-btn w-8 h-8 text-red-400"><Icon name="trash-2" size={12} /></button>
                                    </div>
                                </div>
                            ))}
                        </div>
                        <button onClick={() => {setEditForm({ id: Date.now(), name: '', price: '', imgId: '🍌' }); setShowProdModal(true);}} className="w-full clay-btn py-3 text-xs uppercase font-black text-[#ed7d31]">Tambah Menu</button>
                    </div>

                    {showProdModal && editForm && (
                        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-[200] flex items-center justify-center p-4">
                            <div className="clay-card p-6 max-w-sm w-full relative space-y-3">
                                <button onClick={() => setShowProdModal(false)} className="absolute top-4 right-4 clay-btn w-8 h-8 rounded-full">✕</button>
                                <h3 className="font-black text-lg text-gray-800">{localProducts.find(p=>p.id === editForm.id) ? 'Edit Menu' : 'Tambah Menu'}</h3>
                                <input type="text" value={editForm.name} onChange={e=>setEditForm({...editForm, name: e.target.value})} className="clay-input text-sm" placeholder="Nama Menu" />
                                <div className="flex gap-2">
                                    <input type="number" value={editForm.price} onChange={e=>setEditForm({...editForm, price: e.target.value})} className="clay-input text-sm flex-1" placeholder="Harga" />
                                    <input type="text" value={editForm.imgId} onChange={e=>setEditForm({...editForm, imgId: e.target.value})} className="clay-input text-sm w-16 text-center" placeholder="Emoji" />
                                </div>
                                <button onClick={handleSaveProduct} className="w-full clay-btn-orange py-3 text-xs uppercase font-black mt-2">Simpan Menu</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
