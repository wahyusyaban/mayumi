    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // ==========================================
        //         SUPABASE CONFIGURATION
        // ==========================================
        const SUPABASE_URL = 'https://mhbyivcjcnndqogjgzxb.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1oYnlpdmNqY25uZHFvZ2pnenhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5NTY0NzUsImV4cCI6MjEwMTUzMjQ3NX0.rAeV91oayf6BdbBP6vZL7AYxfhTXBkM9_yWuJcgaB7M';  
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- ICONS ---
        const Icon = ({ name, size = 24, className = "" }) => {
            const iconRef = React.useRef(null);
            
            useEffect(() => {
                if (iconRef.current) {
                    iconRef.current.innerHTML = `<i data-lucide="${name}" width="${size}" height="${size}"></i>`;
                    lucide.createIcons();
                }
            }, [name, size]);

            return (
                <span 
                    ref={iconRef} 
                    className={`inline-flex items-center justify-center ${className}`}
                ></span>
            );
        };

        // --- DATA PRODUK FALLBACK (Jika DB kosong) ---
        const DEFAULT_PRODUCTS = [
            { id: 1, name: 'Coklat keju', price: 15000, label: '14K', imgId: '🍫🧀' },
            { id: 2, name: 'Coklat parut keju', price: 15000, label: '14K', imgId: '🍫🌨️' },
            { id: 3, name: 'Coklat', price: 13000, label: '12K', imgId: '🍫' },
            { id: 4, name: 'Tiramisu', price: 13000, label: '12K', imgId: '🍰' },
            { id: 5, name: 'Matcha', price: 13000, label: '12K', imgId: '🍵' },
            { id: 6, name: 'Gula aren', price: 12000, label: '10K', imgId: '🍯' },
            { id: 7, name: 'Bebas mix', price: 13000, label: '12K', desc: '(Mix 2 varian)', imgId: '🍪' },
            { id: 8, name: 'Keju mix', price: 14000, label: '14K', desc: '(Mix 1 varian dengan Keju)', imgId: '🧀' },
        ];

        // --- UTILS ---
        const formatRp = (num) => {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num);
        };

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // --- CUTE MODAL ALERT ---
        const CuteModal = ({ config, onClose }) => {
            if (!config) return null;
            return (
                <div className="fixed inset-0 bg-black/60 z-[200] flex items-center justify-center p-4">
                    <div className="bg-white rounded-3xl p-6 max-w-xs w-full text-center border-4 border-mayumi-yellow shadow-xl transform transition-all scale-100">
                        <div className="text-6xl mb-3 animate-bounce">{config.emoji || '🥺'}</div>
                        <h3 className="font-bold text-mayumi-brown mb-5 leading-tight">{config.message}</h3>
                        <div className="flex gap-2">
                            {config.onConfirm && (
                                 <button onClick={onClose} className="flex-1 p-3 bg-gray-200 text-gray-700 rounded-xl font-bold hover:bg-gray-300 transition">Batal deh</button>
                            )}
                            <button onClick={() => { if(config.onConfirm) config.onConfirm(); onClose(); }} className={`flex-1 p-3 rounded-xl font-bold text-white shadow-[0_3px_0_rgba(0,0,0,0.2)] active:shadow-none active:translate-y-1 transition ${config.onConfirm ? 'bg-mayumi-red' : 'bg-mayumi-green'}`}>
                                {config.onConfirm ? 'Ya, Hapus!' : 'Okee!'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- KOMPONEN UTAMA ---
        const App = () => {
            const [role, setRole] = useState('user'); // 'user' atau 'admin'
            const [products, setProducts] = useState(DEFAULT_PRODUCTS);
            const [orders, setOrders] = useState([]);
            const [reviews, setReviews] = useState([]);
            const [settings, setSettings] = useState({
                storeLat: -6.2088, 
                storeLon: 106.8456,
                costPerKm: 1000
            });
            const [isKeyboardOpen, setIsKeyboardOpen] = useState(false);
            
            // State untuk PIN Admin
            const [showPinModal, setShowPinModal] = useState(false);
            const [pinInput, setPinInput] = useState('');
            const [isCheckingPin, setIsCheckingPin] = useState(false);

            // State Alert
            const [alertConfig, setAlertConfig] = useState(null);
            const showAlert = (message, emoji, onConfirm = null) => {
                setAlertConfig({ message, emoji, onConfirm });
            };
            const closeAlert = () => setAlertConfig(null);

            // Fetch data dari Supabase
            useEffect(() => {
                const fetchData = async () => {
                    try {
                        const { data: prodData, error: prodErr } = await supabase.from('products').select('*').order('id', { ascending: true });
                        if (prodData && prodData.length > 0) setProducts(prodData);
                        else if (prodErr) console.warn("Supabase Produk:", prodErr.message);

                        const { data: setData, error: setErr } = await supabase.from('settings').select('*').eq('id', 1).single();
                        if (setData) setSettings(setData);

                        const { data: ordData, error: ordErr } = await supabase.from('orders').select('*').order('date', { ascending: false });
                        if (ordData) setOrders(ordData);

                        const { data: revData, error: revErr } = await supabase.from('reviews').select('*').order('created_at', { ascending: false });
                        if (revData) setReviews(revData);
                        
                    } catch (error) {
                        console.error("Gagal terhubung ke Supabase. Menggunakan data default.", error);
                    }
                };
                
                fetchData();
            }, []);

            useEffect(() => {
                const handleFocusIn = (e) => {
                    if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) {
                        setIsKeyboardOpen(true);
                    }
                };
                const handleFocusOut = () => setIsKeyboardOpen(false);
                
                const handleResize = () => {
                    if (window.innerHeight < 500) {
                        setIsKeyboardOpen(true);
                    } else if (!document.activeElement || !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
                        setIsKeyboardOpen(false);
                    }
                };

                document.addEventListener('focusin', handleFocusIn);
                document.addEventListener('focusout', handleFocusOut);
                window.addEventListener('resize', handleResize);
                
                return () => {
                    document.removeEventListener('focusin', handleFocusIn);
                    document.removeEventListener('focusout', handleFocusOut);
                    window.removeEventListener('resize', handleResize);
                };
            }, []);

            const handlePinSubmit = async () => {
                if (!pinInput) return;
                setIsCheckingPin(true);
                try {
                    const { data, error } = await supabase.auth.signInWithPassword({
                        email: 'admin@pisangmayumi.com',
                        password: pinInput
                    });
                    
                    if (error) throw error;
                    if (data.session) {
                        setRole('admin');
                        setShowPinModal(false);
                        setPinInput('');
                    }
                } catch (error) {
                    showAlert('Oops! PIN-nya salah nih. Coba inget-inget lagi yaa 🍌', '🙈');
                    setPinInput('');
                } finally {
                    setIsCheckingPin(false);
                }
            };

            return (
                <div className={`min-h-screen max-w-md mx-auto bg-mayumi-cream shadow-2xl relative border-x-4 border-white ${isKeyboardOpen ? 'pb-4' : 'pb-24'}`}>
                    {/* Header Global */}
                    <header className={`bg-mayumi-yellow text-mayumi-brown p-5 rounded-b-[3rem] shadow-sm z-40 border-b-4 border-yellow-300 relative overflow-hidden ${isKeyboardOpen ? '' : 'sticky top-0'}`}>
                        <div className="absolute top-[-10px] right-[-10px] opacity-20 text-7xl">🍌</div>
                        <div className="flex justify-between items-center relative z-10">
                            <div className="relative z-20">
                                <h1 className="text-3xl font-black tracking-wider leading-none text-mayumi-brown drop-shadow-[2px_2px_0_rgba(255,255,255,1)]">
                                    Pisang<br/>Kembung
                                </h1>
                                <span className="bg-white text-mayumi-green font-bold px-3 py-1 rounded-full text-sm mt-1 inline-block border-2 border-mayumi-green transform -rotate-2 shadow-sm">
                                    Mayumi
                                </span>
                            </div>

                            <div className="absolute left-1/2 top-1/2 transform -translate-x-1/2 -translate-y-1/2 z-10 pointer-events-none">
                                <img 
                                    src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhxV6yhpL_k0ZhI70PRISUNtvNB4oFayGkZaKOhJ0Vv2bXd_BoeVraa43uLF3lGr-UkuamsS4Ra5STvSXibU-XoSBf_Vz2AmDbUhvbjsT2OXAiQy5B4_lecTnXd4BqKkiq4pa-aNhmsKROrnliATN07hzvpeNexsfK1_lqPdrEx9WgQShMN7JxV4rXHgPob/s500/file_00000000f3408230ab45d1aa7623b404-removebg-preview.png" 
                                    alt="Maskot Pisang Mayumi" 
                                    className="h-28 w-auto object-contain drop-shadow-xl"
                                />
                            </div>

                            <div className="relative z-20">
                                <button 
                                    onClick={async () => {
                                        if (role === 'user') {
                                            setShowPinModal(true);
                                        } else {
                                            await supabase.auth.signOut();
                                            setRole('user');
                                        }
                                    }}
                                    className="text-xs bg-white text-mayumi-brown px-4 py-2 rounded-full font-bold shadow-md hover:bg-yellow-100 transition border-2 border-mayumi-brown border-dashed active:scale-95"
                                >
                                    Mode: {role === 'user' ? 'User' : 'Admin'}
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="p-4 relative z-0">
                        {role === 'user' 
                            ? <UserView products={products} orders={orders} setOrders={setOrders} settings={settings} isKeyboardOpen={isKeyboardOpen} showAlert={showAlert} reviews={reviews} setReviews={setReviews} /> 
                            : <AdminView orders={orders} setOrders={setOrders} settings={settings} setSettings={setSettings} products={products} setProducts={setProducts} showAlert={showAlert} />
                        }
                    </main>

                    {showPinModal && (
                        <div className="fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl p-6 max-w-sm w-full border-4 border-mayumi-yellow shadow-xl relative">
                                <h3 className="font-black text-2xl text-mayumi-brown mb-2 text-center">Akses Admin 🔒</h3>
                                <p className="text-xs text-gray-500 font-bold mb-4 text-center">Masukkan PIN rahasia untuk masuk</p>
                                
                                <input 
                                    type="password" 
                                    value={pinInput} 
                                    onChange={(e) => setPinInput(e.target.value)}
                                    className="w-full p-4 rounded-xl border-4 border-dashed border-gray-200 focus:outline-none focus:border-mayumi-orange text-center text-3xl font-bold tracking-[0.2em] mb-4 text-mayumi-brown bg-gray-50"
                                    placeholder="••••••••"
                                    maxLength={12}
                                />
                                
                                <div className="flex gap-2">
                                    <button onClick={() => {setShowPinModal(false); setPinInput('');}} className="flex-1 p-3 bg-gray-200 rounded-xl text-sm font-bold text-gray-700 hover:bg-gray-300 transition">Batal</button>
                                    <button 
                                        onClick={handlePinSubmit} 
                                        disabled={isCheckingPin}
                                        className={`flex-1 p-3 text-white rounded-xl text-sm font-bold active:translate-y-1 transition flex justify-center items-center gap-2 ${isCheckingPin ? 'bg-gray-400 shadow-none' : 'bg-mayumi-orange shadow-[0_3px_0_#c2410c] active:shadow-none'}`}
                                    >
                                        {isCheckingPin ? <Icon name="loader" size={18} className="animate-spin" /> : 'Masuk'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <CuteModal config={alertConfig} onClose={closeAlert} />
                </div>
            );
        };

        // ==========================================
        //               USER VIEW
        // ==========================================
        const UserView = ({ products, orders, setOrders, settings, isKeyboardOpen, showAlert, reviews, setReviews }) => {
            const [activeTab, setActiveTab] = useState('menu'); 
            const [cart, setCart] = useState([]);

            const addToCart = (product) => {
                const existing = cart.find(item => item.id === product.id);
                if (existing) {
                    setCart(cart.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item));
                } else {
                    setCart([...cart, { ...product, qty: 1 }]);
                }
            };

            const cartCount = cart.reduce((sum, item) => sum + item.qty, 0);

            return (
                <div>
                    {activeTab === 'menu' && <MenuTab products={products} onAdd={addToCart} />}
                    {activeTab === 'cart' && <CartTab cart={cart} setCart={setCart} settings={settings} setOrders={setOrders} onCheckoutSuccess={() => { setCart([]); setActiveTab('status'); }} showAlert={showAlert} />}
                    {activeTab === 'status' && <StatusTab orders={orders} showAlert={showAlert} />}
                    {activeTab === 'review' && <ReviewTab reviews={reviews} setReviews={setReviews} showAlert={showAlert} />}

                    {!isKeyboardOpen && (
                        <nav className="fixed bottom-4 left-4 right-4 max-w-[calc(100%-2rem)] md:max-w-[calc(28rem-2rem)] mx-auto bg-white border-4 border-mayumi-yellow rounded-3xl flex justify-around p-2 z-50 shadow-[0_4px_0_#fde047]">
                            <button onClick={() => setActiveTab('menu')} className={`flex flex-col items-center p-2 rounded-2xl transition w-1/4 ${activeTab === 'menu' ? 'bg-yellow-100 text-mayumi-brown font-bold' : 'text-gray-400 font-medium'}`}>
                                <Icon name="store" />
                                <span className="text-[10px] sm:text-xs mt-1">Menu</span>
                            </button>
                            <button onClick={() => setActiveTab('cart')} className={`flex flex-col items-center p-2 rounded-2xl relative transition w-1/4 ${activeTab === 'cart' ? 'bg-yellow-100 text-mayumi-brown font-bold' : 'text-gray-400 font-medium'}`}>
                                <Icon name="shopping-bag" />
                                {cartCount > 0 && <span className="absolute -top-1 right-3 bg-mayumi-red text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-bold border-2 border-white shadow-sm">{cartCount}</span>}
                                <span className="text-[10px] sm:text-xs mt-1">Keranjang</span>
                            </button>
                            <button onClick={() => setActiveTab('status')} className={`flex flex-col items-center p-2 rounded-2xl transition w-1/4 ${activeTab === 'status' ? 'bg-yellow-100 text-mayumi-brown font-bold' : 'text-gray-400 font-medium'}`}>
                                <Icon name="clipboard-list" />
                                <span className="text-[10px] sm:text-xs mt-1">Pesanan</span>
                            </button>
                            <button onClick={() => setActiveTab('review')} className={`flex flex-col items-center p-2 rounded-2xl transition w-1/4 ${activeTab === 'review' ? 'bg-yellow-100 text-mayumi-brown font-bold' : 'text-gray-400 font-medium'}`}>
                                <Icon name="star" />
                                <span className="text-[10px] sm:text-xs mt-1">Review</span>
                            </button>
                        </nav>
                    )}
                </div>
            );
        };

        const MenuTab = ({ products, onAdd }) => {
            const [showMixModal, setShowMixModal] = useState(false);
            const [mixType, setMixType] = useState(''); // 'bebas' atau 'keju'
            const [selectedFlavors, setSelectedFlavors] = useState([]);
            
            const baseFlavors = products.filter(p => !p.name.toLowerCase().includes('mix') && p.id !== 7 && p.id !== 8);
            
            // Logika pengecualian menu Mix
            const selectableMixFlavors = baseFlavors.filter(p => {
                const flavorName = p.name.toLowerCase();
                
                // 1. Selalu sembunyikan coklat keju dan coklat parut keju untuk SEMUA Mix
                if (flavorName === 'coklat keju' || flavorName === 'coklat parut keju') {
                    return false;
                }
                
                // 2. Khusus untuk Keju mix, sembunyikan juga menu 'coklat'
                if (mixType === 'keju' && flavorName === 'coklat') {
                    return false;
                }
                
                return true;
            });

            const handleProductClick = (p) => {
                if (p.id === 7 || p.name.toLowerCase().includes('bebas mix')) {
                    setMixType('bebas');
                    setShowMixModal(true);
                    setSelectedFlavors([]);
                } else if (p.id === 8 || p.name.toLowerCase().includes('keju mix')) {
                    setMixType('keju');
                    setShowMixModal(true);
                    setSelectedFlavors([]);
                } else {
                    onAdd(p);
                }
            };

            const maxSelection = mixType === 'bebas' ? 2 : 1;

            const toggleFlavor = (flavorName) => {
                if (selectedFlavors.includes(flavorName)) {
                    setSelectedFlavors(selectedFlavors.filter(f => f !== flavorName));
                } else {
                    if (selectedFlavors.length < maxSelection) {
                        setSelectedFlavors([...selectedFlavors, flavorName]);
                    }
                }
            };

            const handleAddMix = () => {
                if (selectedFlavors.length === maxSelection) {
                    if (mixType === 'bebas') {
                        const mixP = products.find(p => p.id === 7) || { id: 7, name: 'Bebas mix', price: 12000, imgId: '🎭' };
                        const mixProduct = {
                            ...mixP,
                            id: `7-${selectedFlavors.join('-')}`, 
                            name: `Bebas mix (${selectedFlavors.join(' & ')})`,
                        };
                        onAdd(mixProduct);
                    } else if (mixType === 'keju') {
                        const mixP = products.find(p => p.id === 8) || { id: 8, name: 'Keju mix', price: 14000, imgId: '🧀' };
                        const mixProduct = {
                            ...mixP,
                            id: `8-${selectedFlavors[0]}`, 
                            name: `Keju mix (${selectedFlavors[0]} & Keju)`,
                        };
                        onAdd(mixProduct);
                    }
                    setShowMixModal(false);
                }
            };

            return (
                <div className="space-y-6 pt-2 pb-10">
                    <div className="text-center space-y-1">
                        <p className="text-mayumi-brown font-bold text-lg">"Manis, lembut, lumer di mulut! <span className="text-pink-400">💕</span>"</p>
                    </div>
                    
                    <div className="bg-white p-5 rounded-3xl border-4 border-mayumi-cream shadow-sm relative mt-8">
                        <div className="absolute -top-5 left-1/2 transform -translate-x-1/2 w-[80%]">
                            <div className="bg-mayumi-brown text-white text-center py-2 px-4 rounded-xl font-bold text-lg shadow-md border-b-4 border-orange-900 relative">
                                <div className="absolute -left-2 top-2 w-4 h-4 bg-orange-900 rotate-45 -z-10"></div>
                                <div className="absolute -right-2 top-2 w-4 h-4 bg-orange-900 rotate-45 -z-10"></div>
                                Pilihan Rasa & Harga
                            </div>
                        </div>

                        <div className="mt-6 space-y-3">
                            {products.map((p) => (
                                <div key={p.id} className="flex items-center justify-between border-b-2 border-dashed border-yellow-200 pb-3 last:border-0 last:pb-0">
                                    <div className="flex items-center gap-3">
                                        <div className="text-3xl bg-yellow-50 w-12 h-12 flex items-center justify-center rounded-2xl border-2 border-yellow-200 shadow-sm">{p.imgId}</div>
                                        <div>

                setIsRefreshing(true);
                
                try {
                    const { data, error } = await supabase
                        .from('orders')
                        .select('*')
                        .eq('phone', checkPhone)
                        .order('date', { ascending: false });

                    if (error) throw error;
                    
                    setMyOrders(data || []);
                    setHasSearched(true);
                } catch (error) {
                    const filtered = orders.filter(o => o.phone === checkPhone).sort((a,b) => new Date(b.date) - new Date(a.date));
                    setMyOrders(filtered);
                    setHasSearched(true);
                } finally {
                    setIsRefreshing(false);
                }

                    case 'Sedang Diproses': return 'bg-blue-200 text-blue-900 border-blue-400';

                const newReview = {

                };
                
                try {
                    const { data, error } = await supabase.from('reviews').insert([newReview]).select();
                    if(error) throw error;
                    
                    if(data && data.length > 0){
                        setReviews([data[0], ...reviews]);
                    } else {
                        setReviews([newReview, ...reviews]);
                    }

                    setShowModal(false);
                    setName('');
                    setRating(5);
                    setComment('');
                    showAlert("Makasih review cantiknya! Makin semangat deh jualan 💖", "😍");
                } catch (error) {
                    console.error("Gagal mengirim review:", error);
                    showAlert("Duh gagal kirim review, cek koneksi internetmu ya!", "🔌");
                } finally {
                    setIsSubmitting(false);
                }
            };

            return (
                <div className="space-y-4 pb-10">
                    <div className="flex justify-between items-center bg-white p-4 rounded-3xl border-4 border-mayumi-yellow shadow-sm">
                        <h2 className="font-bold text-xl text-mayumi-brown flex items-center gap-2">
                            <Icon name="star" className="text-yellow-400 fill-current" /> Suara Konsumen
                        </h2>
                        <button 
                            onClick={() => setShowModal(true)} 
                            className="bg-mayumi-green text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow-[0_3px_0_#4d7c0f] active:shadow-none active:translate-y-1 transition flex items-center gap-1"
                        >
                            <Icon name="edit-3" size={14}/> Tulis Review
                        </button>
                    </div>

                    {reviews.length === 0 ? (
                         <div className="text-center py-10 bg-white rounded-3xl border-4 border-dashed border-gray-200 shadow-sm mt-4">
                            <span className="text-6xl mb-3 block animate-bounce">🥺</span>
                            <p className="text-sm font-bold text-gray-400">Belum ada review nih.<br/>Yuk jadi yang pertama kasih komentar manis!</p>
                        </div>
                    ) : (
                        <div className="space-y-4 mt-4">
                            {reviews.map((r, i) => (
                                <div key={r.id || i} className="bg-white p-5 rounded-3xl border-4 border-mayumi-cream shadow-sm relative">
                                    <div className="absolute top-0 right-4 transform -translate-y-1/2 bg-yellow-100 border-2 border-white px-2 py-0.5 rounded-full shadow-sm text-xs text-yellow-600 font-bold flex gap-0.5">
                                        {[...Array(5)].map((_, idx) => (
                                            <Icon key={idx} name="star" size={12} className={idx < r.rating ? "text-yellow-400 fill-current" : "text-gray-300"} />
                                        ))}
                                    </div>
                                    <div className="flex justify-between items-end mb-2">
                                        <h4 className="font-black text-mayumi-brown text-lg">{r.name}</h4>
                                        <p className="text-[10px] text-gray-400 font-bold bg-gray-100 px-2 py-1 rounded-md">{new Date(r.created_at).toLocaleDateString('id-ID')}</p>
                                    </div>
                                    <p className="text-gray-600 text-sm font-medium leading-relaxed bg-orange-50 p-3 rounded-xl border border-dashed border-orange-100">"{r.comment}"</p>
                                </div>
                            ))}
                        </div>
                    )}

                    {showModal && (
                        <div className="fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl p-6 max-w-sm w-full border-4 border-mayumi-yellow shadow-xl relative transform transition-all space-y-5">
                                <button onClick={() => setShowModal(false)} className="absolute top-3 right-3 text-gray-400 hover:text-mayumi-red bg-gray-100 rounded-full w-8 h-8 flex items-center justify-center font-bold transition">✕</button>
                                <div className="text-center">
                                    <span className="text-4xl block mb-2">✍️</span>
                                    <h3 className="font-black text-2xl text-mayumi-brown">Tulis Review</h3>
                                </div>
                                
                                <div>
                                    <label className="text-xs font-bold text-gray-500 mb-1.5 block">Nama Panggilan Kamu</label>
                                    <input type="text" value={name} onChange={e=>setName(e.target.value)} className="w-full p-3 rounded-xl border-2 border-gray-200 focus:outline-none focus:border-mayumi-orange text-sm font-bold text-mayumi-brown bg-gray-50" placeholder="Si manis..." />
                                </div>

                                <div>
                                    <label className="text-xs font-bold text-gray-500 mb-2 block text-center">Kasih Bintang Berapa Nih?</label>
                                    <div className="flex justify-center gap-2 bg-yellow-50 py-3 rounded-xl border-2 border-dashed border-yellow-200">
                                        {[1, 2, 3, 4, 5].map(star => (
                                            <button key={star} onClick={() => setRating(star)} className="focus:outline-none transform transition hover:scale-110 active:scale-95">
                                                <Icon name="star" size={36} className={star <= rating ? "text-yellow-400 fill-current drop-shadow-sm" : "text-yellow-100 fill-current"} />
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div>
                                    <label className="text-xs font-bold text-gray-500 mb-1.5 block">Kesan / Pesan (Jujur aja kak!)</label>
                                    <textarea value={comment} onChange={e=>setComment(e.target.value)} rows="3" className="w-full p-3 rounded-xl border-2 border-gray-200 focus:outline-none focus:border-mayumi-orange text-sm font-bold text-mayumi-brown bg-gray-50 resize-none" placeholder="Pisangnya lumer banget sumpah..."></textarea>
                                </div>

                                <button onClick={handleSubmit} disabled={isSubmitting} className={`w-full py-3.5 rounded-xl font-black text-lg text-white transition flex justify-center items-center gap-2 border-b-4 ${isSubmitting ? 'bg-gray-400 border-gray-500 border-b-0 translate-y-1' : 'bg-mayumi-yellow text-mayumi-brown border-yellow-500 hover:bg-yellow-400 active:border-b-0 active:translate-y-1'}`}>
                                    {isSubmitting ? <Icon name="loader" className="animate-spin" /> : 'Kirim Review! 🚀'}
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };


        // ==========================================
        //               ADMIN VIEW
        // ==========================================
        const AdminView = ({ orders, setOrders, settings, setSettings, products, setProducts, showAlert }) => {
            const [tab, setTab] = useState('orders'); 

            return (
                <div className="space-y-4 pb-10">
                    <div className="flex gap-2 mb-4 bg-gray-200 p-1.5 rounded-xl border-2 border-gray-300">
                        <button 
                            onClick={() => setTab('orders')} 
                            className={`flex-1 py-2.5 text-sm font-bold rounded-lg transition ${tab === 'orders' ? 'bg-white shadow-sm text-mayumi-darkGreen border border-gray-100' : 'text-gray-500 hover:bg-gray-300'}`}
                        >
                            Daftar Pesanan
                        </button>
                        <button 
                            onClick={() => setTab('settings')} 
                            className={`flex-1 py-2.5 text-sm font-bold rounded-lg transition ${tab === 'settings' ? 'bg-white shadow-sm text-mayumi-darkGreen border border-gray-100' : 'text-gray-500 hover:bg-gray-300'}`}
                        >
                            Pengaturan
                        </button>
                    </div>

                    {tab === 'orders' && <AdminOrders orders={orders} setOrders={setOrders} settings={settings} showAlert={showAlert} />}
                    {tab === 'settings' && <AdminSettings settings={settings} setSettings={setSettings} products={products} setProducts={setProducts} showAlert={showAlert} />}
                </div>
            );
        };

        const AdminOrders = ({ orders, setOrders, settings, showAlert }) => {
            const [isRefreshing, setIsRefreshing] = useState(false);

            const handleRefresh = async () => {
                setIsRefreshing(true);
                try {
                    const { data, error } = await supabase.from('orders').select('*').order('date', { ascending: false });
                    if (error) throw error;
                    if (data) {
                        setOrders(data);
                    }
                } catch (error) {
                    console.error("Gagal refresh pesanan:", error);
                    showAlert("Gagal memperbarui pesanan. Cek koneksimu ya!", "😢");
                } finally {
                    setIsRefreshing(false);
                }
            };

            const updateStatus = async (id, newStatus) => {
                setOrders(orders.map(o => o.id === id ? { ...o, status: newStatus } : o));
                
                const { error } = await supabase.from('orders').update({ status: newStatus }).eq('id', id);
                if (error) {
                    console.error("Gagal update status:", error);
                    showAlert("Gagal update status di server.", "😢");
                }
            };

            const handleDelete = (id) => {
                showAlert("Beneran mau hapus pesanan ini? Nanti datanya nggak bisa balik lho!", "🗑️", async () => {
                    setOrders(orders.filter(o => o.id !== id));
                    
                    const { error } = await supabase.from('orders').delete().eq('id', id);
                    if (error) {
                        console.error("Gagal menghapus pesanan:", error);
                        showAlert("Gagal menghapus pesanan di server.", "😢");
                    }
                });
            };

            const openGoogleMaps = (coords) => {
                if(!coords) return showAlert("Lokasi pelanggan belum ada nih.", "🗺️");
                const url = `https://www.google.com/maps/dir/?api=1&origin=${settings.storeLat},${settings.storeLon}&destination=${coords.lat},${coords.lon}`;
                window.open(url, '_blank');
            };

            const getWaLink = (phone) => {
                if (!phone) return '#';
                let cleaned = phone.replace(/\D/g, '');
                if (cleaned.startsWith('0')) {
                    cleaned = '62' + cleaned.substring(1);
                }
                return `https://wa.me/${cleaned}`;
            };

            const STATUS_OPTIONS = [
                'Menunggu Konfirmasi', 'Pesanan Masuk', 'Sedang Diproses', 'Sedang Dikirim', 'Selesai', 'Dibatalkan'
            ];

            return (
                <div className="space-y-4">
                    <div className="flex justify-between items-center mb-2 bg-white p-3 rounded-2xl shadow-sm border-2 border-gray-100">
                        <h2 className="font-bold text-lg text-gray-800 flex items-center gap-2"><Icon name="list" size={18}/> Pesanan</h2>
                        <button 
                            onClick={handleRefresh} 
                            disabled={isRefreshing}
                            className={`px-4 py-2 rounded-xl font-bold text-xs shadow-sm flex items-center gap-2 active:scale-95 transition border-2 ${isRefreshing ? 'bg-gray-200 text-gray-500 border-gray-300' : 'bg-mayumi-yellow text-mayumi-brown border-yellow-300 hover:bg-yellow-400'}`}
                        >
                            <Icon name="refresh-cw" size={14} className={isRefreshing ? "animate-spin" : ""} /> 
                            {isRefreshing ? 'Memuat...' : 'Refresh'}
                        </button>
                    </div>
                    {orders.length === 0 ? <div className="text-center p-10 bg-white rounded-3xl border-2 border-dashed"><span className="text-4xl block mb-2">📭</span><p className="text-gray-500 text-sm font-bold">Belum ada pesanan masuk.</p></div> : null}
                    
                    {orders.map(order => (
                        <div key={order.id} className="bg-white rounded-2xl shadow-sm border-l-8 border-mayumi-green border-y-2 border-r-2 p-4 relative overflow-hidden">
                            <button 
                                onClick={() => handleDelete(order.id)}
                                className="absolute top-3 right-3 text-gray-300 hover:text-mayumi-red transition bg-gray-50 rounded-lg p-2 z-10 border border-transparent hover:border-red-200"
                                title="Hapus Pesanan"
                            >
                                <Icon name="trash-2" size={16} />
                            </button>
                            
                            <div className="flex justify-between items-start mb-3 pr-10">
                                <div>
                                    <h3 className="font-bold text-gray-800 text-lg">{order.customerName}</h3>
                                    <a 
                                        href={getWaLink(order.phone)}
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        className="text-xs font-mono text-mayumi-green hover:text-mayumi-darkGreen font-bold flex items-center gap-1 mt-0.5 transition hover:underline"
                                    >
                                        <Icon name="message-circle" size={12} /> {order.phone}
                                    </a>
                                    <p className="text-[10px] text-gray-400 mt-1 font-bold flex items-center gap-1">
                                        <Icon name="clock" size={12} /> {new Date(order.date).toLocaleString('id-ID')}
                                    </p>
                                </div>
                                <div className="text-right">
                                    <p className="font-black text-mayumi-orange text-lg">{formatRp(order.grandTotal)}</p>
                                    <p className="text-[10px] bg-gray-100 px-2 py-0.5 rounded-md text-gray-600 mt-1 inline-block font-bold border">{order.paymentMethod}</p>
                                </div>
                            </div>

                            <div className="bg-gray-50 p-3 rounded-xl border border-dashed border-gray-200 text-sm text-gray-700 mb-4">
                                <p className="font-bold text-gray-500 mb-2 text-xs">Detail Item:</p>
                                {order.items.map(item => (
                                    <div key={item.id} className="flex justify-between font-bold mb-1">
                                        <span><span className="text-mayumi-green">{item.qty}x</span> {item.name}</span>
                                    </div>
                                ))}
                                <div className="border-t border-dashed border-gray-300 mt-2 pt-2 flex justify-between text-gray-500 text-xs font-bold">
                                    <span>Ongkir ({order.distance}km):</span>
                                    <span>{formatRp(order.shippingCost)}</span>
                                </div>
                                {order.coords && (
                                    <button 
                                        onClick={() => openGoogleMaps(order.coords)}
                                        className="mt-3 w-full bg-blue-50 text-blue-600 py-2.5 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-blue-100 border-2 border-blue-200 transition active:scale-95 shadow-sm"
                                    >
                                        <Icon name="map" size={16} /> Lacak Rute di Maps
                                    </button>
                                )}
                            </div>

                            <div className="flex items-center gap-3 bg-yellow-50 p-3 rounded-xl border border-yellow-100">
                                <span className="text-xs font-bold text-gray-500">Status:</span>
                                <select 
                                    value={order.status}
                                    onChange={(e) => updateStatus(order.id, e.target.value)}
                                    className="flex-1 text-sm bg-white border-2 border-yellow-200 p-2 rounded-lg focus:outline-none focus:border-mayumi-orange font-bold text-gray-700 shadow-sm"
                                >
                                    {STATUS_OPTIONS.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                                </select>
                            </div>
                        </div>
                    ))}
                </div>
            );
        };

        const AdminSettings = ({ settings, setSettings, products, setProducts, showAlert }) => {
            const [localSet, setLocalSet] = useState(settings);
            const [localProducts, setLocalProducts] = useState(products);
            const [isSavingStore, setIsSavingStore] = useState(false);
            
            // State untuk kelola Modal Produk
            const [showProdModal, setShowProdModal] = useState(false);
            const [editForm, setEditForm] = useState(null);

            // 1. Simpan Pengaturan Toko (Ongkir & GPS)
            const handleSaveSettings = async () => {
                setIsSavingStore(true);
                try {
                    const { error } = await supabase.from('settings').update({
                        storeLat: localSet.storeLat,
                        storeLon: localSet.storeLon,
                        costPerKm: localSet.costPerKm
                    }).eq('id', 1);

                    if (error) throw error;
                    setSettings(localSet);
                    showAlert('Pengaturan Lokasi & Ongkir berhasil disimpan!', '🎉');
                } catch (error) {
                    console.error("Error saving settings:", error);
                    showAlert('Gagal menyimpan pengaturan!', '😢');
                } finally {
                    setIsSavingStore(false); 
                }
            };

            const handleGetAdminLocation = () => {
                if ("geolocation" in navigator) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            setLocalSet({
                                ...localSet,
                                storeLat: position.coords.latitude,
                                storeLon: position.coords.longitude
                            });
                        },
                        (error) => showAlert("Yah gagal ngambil lokasi dari GPS nih.", "😢")
                    );
                }
            };

            // 2. Fungsi Tambah/Edit/Hapus Produk
            const openAddProduct = () => {
                // Perbaikan: Menggunakan urutan angka biasa (contoh ID: 9) alih-alih Date.now() yang kepanjangan
                const newId = localProducts.length > 0 ? Math.max(...localProducts.map(p => p.id)) + 1 : 1;
                setEditForm({ id: newId, name: '', price: '', desc: '', imgId: '🍌' });
                setShowProdModal(true);
            };

            const openEditProduct = (p) => {
                setEditForm(p);
                setShowProdModal(true);
            };

            const handleDeleteProduct = (id) => {
                showAlert("Yakin mau hapus menu ini? Nanti hilang permanen lho!", "🗑️", async () => {
                    const updatedList = localProducts.filter(p => p.id !== id);
                    setLocalProducts(updatedList);
                    setProducts(updatedList);
                    
                    const { error } = await supabase.from('products').delete().eq('id', id);
                    if (error) showAlert(`Gagal Hapus (Database Error): ${error.message}`, "😢");
                });
            };

            const handleSaveProduct = async () => {
                if(!editForm.name || !editForm.price) return showAlert("Nama dan Harga harus diisi ya!", "⚠️");
                
                const price = Number(editForm.price);
                const label = price >= 1000 ? (price / 1000) + 'K' : price.toString();
                
                // Mencegah error jika deskripsi kosong
                const payload = { 
                    ...editForm, 
                    price, 
                    label,
                    desc: editForm.desc ? editForm.desc : null 
                };
                
                const { error } = await supabase.from('products').upsert([payload]);
                
                if (error) {
                    console.error("Upsert error:", error);
                    // Menampilkan pesan error asli Supabase ke layar (Lebih gampang dilacak)
                    return showAlert(`Gagal simpan: ${error.message}`, "😢");
                }
                
                const exists = localProducts.find(p => p.id === payload.id);
                const newList = exists 
                    ? localProducts.map(p => p.id === payload.id ? payload : p)
                    : [...localProducts, payload];
                
                const sortedList = newList.sort((a,b) => a.id - b.id);
                
                setLocalProducts(sortedList);
                setProducts(sortedList);
                setShowProdModal(false);
                showAlert("Berhasil memperbarui menu!", "✅");
            };

            return (
                <div className="space-y-5">
                    {/* Panel 1: Pengaturan Lokasi & Ongkir */}
                    <div className="bg-white rounded-3xl shadow-sm border-4 border-gray-100 p-5">
                        <h2 className="font-bold text-xl text-gray-800 border-b-2 border-dashed border-gray-200 pb-3 mb-4">Pengaturan Toko ⚙️</h2>
                        
                        <div>
                            <label className="block text-sm font-bold text-gray-600 mb-2">Tarif Ongkir / Km (Rp)</label>
                            <input 
                                type="number" 
                                value={localSet.costPerKm} 
                                onChange={(e) => setLocalSet({...localSet, costPerKm: Number(e.target.value)})}
                                className="w-full p-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-mayumi-green font-bold text-gray-700 bg-gray-50"
                            />
                        </div>

                        <div className="pt-4">
                            <label className="block text-sm font-bold text-gray-600 mb-2">Koordinat Toko (Base Lokasi)</label>
                            <div className="flex gap-2 mb-3 w-full">
                                <input type="number" step="any" placeholder="Latitude" value={localSet.storeLat} onChange={(e) => setLocalSet({...localSet, storeLat: Number(e.target.value)})} className="w-full min-w-0 flex-1 p-3 border-2 border-gray-200 rounded-xl text-sm font-bold bg-gray-50 focus:outline-none focus:border-mayumi-green" />
                                <input type="number" step="any" placeholder="Longitude" value={localSet.storeLon} onChange={(e) => setLocalSet({...localSet, storeLon: Number(e.target.value)})} className="w-full min-w-0 flex-1 p-3 border-2 border-gray-200 rounded-xl text-sm font-bold bg-gray-50 focus:outline-none focus:border-mayumi-green" />
                            </div>
                            <button onClick={handleGetAdminLocation} className="w-full text-sm bg-gray-100 border-2 border-gray-200 text-gray-700 py-3 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-gray-200 transition active:scale-95 shadow-sm">
                                <Icon name="map-pin" size={16} /> Gunakan GPS Saat Ini
                            </button>
                        </div>
                        
                        <button 
                            onClick={handleSaveSettings} 
                            disabled={isSavingStore}
                            className={`w-full mt-6 text-white font-black text-lg py-4 rounded-2xl shadow-[0_4px_0_#166534] active:shadow-none active:translate-y-1 transition flex justify-center items-center gap-2 border-b-4 ${isSavingStore ? 'bg-gray-400 border-gray-500 border-b-0 translate-y-1 cursor-not-allowed shadow-none' : 'bg-mayumi-darkGreen border-green-800 hover:bg-green-800 active:border-b-0 active:translate-y-1'}`}
                        >
                            {isSavingStore ? <><Icon name="loader" size={20} className="animate-spin" /> MENYIMPAN...</> : 'SIMPAN PENGATURAN'}
                        </button>
                    </div>

                    {/* Panel 2: Kelola Menu */}
                    <div className="bg-white rounded-3xl shadow-sm border-4 border-gray-100 p-5">
                        <div className="flex justify-between items-center border-b-2 border-dashed border-gray-200 pb-3 mb-4">
                            <h2 className="font-bold text-xl text-gray-800">Kelola Menu 🍕</h2>
                        </div>
                        
                        <div className="space-y-3 mb-5">
                            {localProducts.map(product => (
                                <div key={product.id} className="flex justify-between items-center bg-gray-50 p-3 rounded-xl border-2 border-gray-100 hover:border-yellow-200 transition">
                                    <div className="flex items-center gap-3">
                                        <span className="text-2xl bg-white w-10 h-10 flex items-center justify-center rounded-lg border shadow-sm">{product.imgId}</span>
                                        <div>
                                            <h4 className="font-bold text-gray-800 text-sm">{product.name}</h4>
                                            <p className="text-xs text-mayumi-orange font-bold">Rp{product.price.toLocaleString('id-ID')}</p>
                                        </div>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={() => openEditProduct(product)} className="bg-blue-100 text-blue-600 p-2 rounded-lg hover:bg-blue-200 transition">
                                            <Icon name="edit-2" size={16} />
                                        </button>
                                        <button onClick={() => handleDeleteProduct(product.id)} className="bg-red-100 text-red-600 p-2 rounded-lg hover:bg-red-200 transition">
                                            <Icon name="trash-2" size={16} />
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>

                        <button 
                            onClick={openAddProduct}
                            className="w-full border-4 border-dashed border-mayumi-yellow text-mayumi-brown bg-yellow-50 hover:bg-yellow-100 font-bold py-3.5 rounded-xl transition flex justify-center items-center gap-2 active:scale-95"
                        >
                            <Icon name="plus" size={18}/> Tambah Menu Baru
                        </button>
                    </div>

                    {/* Modal Tambah/Edit Produk */}
                    {showProdModal && editForm && (
                        <div className="fixed inset-0 bg-black/60 z-[200] flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl p-6 max-w-sm w-full border-4 border-mayumi-yellow shadow-xl relative space-y-4">
                                <button onClick={() => setShowProdModal(false)} className="absolute top-3 right-3 text-gray-400 hover:text-mayumi-red bg-gray-100 rounded-full w-8 h-8 flex items-center justify-center font-bold transition">✕</button>
                                <h3 className="font-black text-xl text-mayumi-brown">{localProducts.find(p=>p.id === editForm.id) ? 'Edit Menu 📝' : 'Tambah Menu 🆕'}</h3>
                                
                                <div className="space-y-3">
                                    <div>
                                        <label className="text-xs font-bold text-gray-500 block mb-1">Nama Menu</label>
                                        <input type="text" value={editForm.name} onChange={e=>setEditForm({...editForm, name: e.target.value})} className="w-full p-2.5 rounded-xl border-2 border-gray-200 focus:outline-none focus:border-mayumi-orange text-sm font-bold bg-gray-50" placeholder="Contoh: Coklat Keju" />
                                    </div>
                                    <div className="flex gap-2">
                                        <div className="flex-1">
                                            <label className="text-xs font-bold text-gray-500 block mb-1">Harga (Rp)</label>
                                            <input type="number" value={editForm.price} onChange={e=>setEditForm({...editForm, price: e.target.value})} className="w-full p-2.5 rounded-xl border-2 border-gray-200 focus:outline-none focus:border-mayumi-orange text-sm font-bold bg-gray-50" placeholder="14000" />
                                        </div>
                                        <div className="w-20">
                                            <label className="text-xs font-bold text-gray-500 block mb-1">Emoji</label>
                                            <input type="text" value={editForm.imgId} onChange={e=>setEditForm({...editForm, imgId: e.target.value})} className="w-full p-2.5 rounded-xl border-2 border-gray-200 focus:outline-none focus:border-mayumi-orange text-sm text-center font-bold bg-gray-50" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-gray-500 block mb-1">Deskripsi Pendek (Opsional)</label>
                                        <input type="text" value={editForm.desc || ''} onChange={e=>setEditForm({...editForm, desc: e.target.value})} className="w-full p-2.5 rounded-xl border-2 border-gray-200 focus:outline-none focus:border-mayumi-orange text-sm font-bold bg-gray-50" placeholder="Misal: (Mix 2 varian)" />
                                    </div>
                                </div>

                                <button onClick={handleSaveProduct} className="w-full bg-mayumi-green text-white font-bold py-3 mt-2 rounded-xl border-b-4 border-green-800 shadow-[0_3px_0_#166534] active:shadow-none active:translate-y-1 transition">
                                    Simpan Menu
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    
</body>
</html>
