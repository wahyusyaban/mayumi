    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // ==========================================
        //         SUPABASE CONFIGURATION
        // ==========================================
        const SUPABASE_URL = 'https://mhbyivcjcnndqogjgzxb.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1oYnlpdmNqY25uZHFvZ2pnenhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5NTY0NzUsImV4cCI6MjEwMTUzMjQ3NX0.rAeV91oayf6BdbBP6vZL7AYxfhTXBkM9_yWuJcgaB7M';  
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- ICONS ---
        const Icon = ({ name, size = 24, className = "" }) => {
            const iconRef = React.useRef(null);
            
            useEffect(() => {
                if (iconRef.current) {
                    iconRef.current.innerHTML = `<i data-lucide="${name}" width="${size}" height="${size}"></i>`;
                    lucide.createIcons();
                }
            }, [name, size]);

            return (
                <span 
                    ref={iconRef} 
                    className={`inline-flex items-center justify-center ${className}`}
                ></span>
            );
        };

        // --- DATA PRODUK FALLBACK (Jika DB kosong) ---
        const DEFAULT_PRODUCTS = [
            { id: 1, name: 'Coklat keju', price: 15000, label: '14K', imgId: '🍫🧀' },
            { id: 2, name: 'Coklat parut keju', price: 15000, label: '14K', imgId: '🍫🌨️' },
            { id: 3, name: 'Coklat', price: 13000, label: '12K', imgId: '🍫' },
            { id: 4, name: 'Tiramisu', price: 13000, label: '12K', imgId: '🍰' },
            { id: 5, name: 'Matcha', price: 13000, label: '12K', imgId: '🍵' },
            { id: 6, name: 'Gula aren', price: 12000, label: '10K', imgId: '🍯' },
            { id: 7, name: 'Bebas mix', price: 13000, label: '12K', desc: '(Mix 2 varian)', imgId: '🍪' },
            { id: 8, name: 'Keju mix', price: 14000, label: '14K', desc: '(Mix 1 varian dengan Keju)', imgId: '🧀' },
        ];

        // --- UTILS ---
        const formatRp = (num) => {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num);
        };

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // --- CUTE MODAL ALERT (CLAYMORPHISM) ---
        const CuteModal = ({ config, onClose }) => {
            if (!config) return null;
            return (
                <div className="fixed inset-0 bg-stone-950/60 backdrop-blur-sm z-[200] flex items-center justify-center p-4">
                    <div className="clay-card p-6 max-w-xs w-full text-center transform transition-all scale-100">
                        <div className="w-20 h-20 mx-auto mb-4 clay-bubble flex items-center justify-center text-5xl animate-bounce">
                            {config.emoji || '🥺'}
                        </div>
                        <h3 className="font-bold clay-title mb-6 leading-relaxed text-base">{config.message}</h3>
                        <div className="flex gap-3 pt-2 clay-divider">
                            {config.onConfirm && (
                                <button onClick={onClose} className="flex-1 p-3 clay-gray rounded-full font-extrabold text-sm clay-btn">
                                    Batal deh
                                </button>
                            )}
                            <button 
                                onClick={() => { if(config.onConfirm) config.onConfirm(); onClose(); }} 
                                className={`flex-1 p-3 rounded-full font-extrabold text-sm text-white clay-btn ${config.onConfirm ? 'clay-danger' : 'clay-orange'}`}
                            >
                                {config.onConfirm ? 'Ya, Hapus!' : 'Okee!'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- KOMPONEN UTAMA ---
        const App = () => {
            const [role, setRole] = useState('user'); // 'user' atau 'admin'
            const [products, setProducts] = useState(DEFAULT_PRODUCTS);
            const [orders, setOrders] = useState([]);
            const [reviews, setReviews] = useState([]);
            const [settings, setSettings] = useState({
                storeLat: -6.2088, 
                storeLon: 106.8456,
                costPerKm: 1000
            });
            const [isKeyboardOpen, setIsKeyboardOpen] = useState(false);
            
            // State untuk PIN Admin
            const [showPinModal, setShowPinModal] = useState(false);
            const [pinInput, setPinInput] = useState('');
            const [isCheckingPin, setIsCheckingPin] = useState(false);

            // State Alert
            const [alertConfig, setAlertConfig] = useState(null);
            const showAlert = (message, emoji, onConfirm = null) => {
                setAlertConfig({ message, emoji, onConfirm });
            };
            const closeAlert = () => setAlertConfig(null);

            // Fetch data dari Supabase
            useEffect(() => {
                const fetchData = async () => {
                    try {
                        const { data: prodData, error: prodErr } = await supabase.from('products').select('*').order('id', { ascending: true });
                        if (prodData && prodData.length > 0) setProducts(prodData);
                        else if (prodErr) console.warn("Supabase Produk:", prodErr.message);

                        const { data: setData, error: setErr } = await supabase.from('settings').select('*').eq('id', 1).single();
                        if (setData) setSettings(setData);

                        const { data: ordData, error: ordErr } = await supabase.from('orders').select('*').order('date', { ascending: false });
                        if (ordData) setOrders(ordData);

                        const { data: revData, error: revErr } = await supabase.from('reviews').select('*').order('created_at', { ascending: false });
                        if (revData) setReviews(revData);
                        
                    } catch (error) {
                        console.error("Gagal terhubung ke Supabase. Menggunakan data default.", error);
                    }
                };
                
                fetchData();
            }, []);

            useEffect(() => {
                const handleFocusIn = (e) => {
                    if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) {
                        setIsKeyboardOpen(true);
                    }
                };
                const handleFocusOut = () => setIsKeyboardOpen(false);
                
                const handleResize = () => {
                    if (window.innerHeight < 500) {
                        setIsKeyboardOpen(true);
                    } else if (!document.activeElement || !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
                        setIsKeyboardOpen(false);
                    }
                };

                document.addEventListener('focusin', handleFocusIn);
                document.addEventListener('focusout', handleFocusOut);
                window.addEventListener('resize', handleResize);
                
                return () => {
                    document.removeEventListener('focusin', handleFocusIn);
                    document.removeEventListener('focusout', handleFocusOut);
                    window.removeEventListener('resize', handleResize);
                };
            }, []);

            const handlePinSubmit = async () => {
                if (!pinInput) return;
                setIsCheckingPin(true);
                try {

            // Logika pengecualian menu Mix
            const selectableMixFlavors = baseFlavors.filter(p => {
                const flavorName = p.name.toLowerCase();
                
                // 1. Selalu sembunyikan coklat keju dan coklat parut keju untuk SEMUA Mix
                if (flavorName === 'coklat keju' || flavorName === 'coklat parut keju') {
                    return false;
                }
                
                // 2. Khusus untuk Keju mix, sembunyikan juga menu 'coklat'
                if (mixType === 'keju' && flavorName === 'coklat') {
                    return false;
                }
                
                return true;
            });

            const handleProductClick = (p) => {
                if (p.id === 7 || p.name.toLowerCase().includes('bebas mix')) {
                    setMixType('bebas');
                    setShowMixModal(true);
                    setSelectedFlavors([]);
                } else if (p.id === 8 || p.name.toLowerCase().includes('keju mix')) {

                    setShowMixModal(true);
                    setSelectedFlavors([]);

                    onAdd(p);

            const toggleFlavor = (flavorName) => {
                if (selectedFlavors.includes(flavorName)) {
                    setSelectedFlavors(selectedFlavors.filter(f => f !== flavorName));
                } else {
                    if (selectedFlavors.length < maxSelection) {
                        setSelectedFlavors([...selectedFlavors, flavorName]);

                if (selectedFlavors.length === maxSelection) {

                        onAdd(mixProduct);

                        const mixP = products.find(p => p.id === 8) || { id: 8, name: 'Keju mix', price: 14000, imgId: '🧀' };
                        const mixProduct = {
                            ...mixP,
                            id: `8-${selectedFlavors[0]}`,

                        onAdd(mixProduct);

                        <span className="clay-mint px-2.5 py-1 rounded-full text-[10px] font-extrabold shrink-0">
                            ● READY
                        </span>
                    </div>
                    
                    <div className="clay-card p-4 space-y-3.5">
                        {/* Section Header Banner (like yellow Komisi bar in Reference Image 1) */}

                            <span className="font-black text-sm sm:text-base tracking-wide uppercase flex items-center gap-2">
                                <span>🍌</span> Pilihan Rasa & Harga
                            </span>
                            <span className="text-xs font-extrabold opacity-85">
                                {products.length} Varian
                            </span>
                        </div>

                        <div className="space-y-3">

                                <div

                                        <div className="flex items-center gap-3">
                                            {/* Yellow 3D Square Icon Box (like Scissors box in Reference Image 1) */}
                                            <div className="text-2xl clay-bubble w-13 h-13 p-2.5 flex items-center justify-center shrink-0">
                                                {p.imgId}
                                            </div>
                                            <div>
                                                <h4 className="font-black clay-title text-base uppercase tracking-tight leading-snug">
                                                    {p.name}
                                                </h4>
                                                <div className="flex flex-wrap items-center gap-1.5 mt-1">
                                                    <span className="clay-red px-2.5 py-0.5 rounded-full text-[10px] font-extrabold uppercase">
                                                        FAVORIT
                                                    </span>
                                                    {p.desc && (

                                                <span className="clay-price-text font-black text-lg leading-none">
                                                    {p.label}
                                                </span>
                                            </div>
                                            <button 
                                                onClick={() => handleProductClick(p)}
                                                className="clay-orange text-white w-11 h-11 rounded-xl flex items-center justify-center clay-btn"
                                                aria-label={`Tambah ${p.name}`}
                                            >
                                                <Icon name="plus" size={20} />
                                            </button>
                                        </div>

                        <div className="pt-2 clay-divider">

        const CartTab = ({ cart, setCart, settings, setOrders, onCheckoutSuccess, showAlert }) => {
            const [name, setName] = useState('');
            const [phone, setPhone] = useState('');
            const [payment, setPayment] = useState('COD');
            const [userCoords, setUserCoords] = useState(null);
            const [isLoadingLoc, setIsLoadingLoc] = useState(false);
            const [qrisModal, setQrisModal] = useState(false);

            const itemsTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0); 
            
            let distance = 0;
            let shippingCost = 0;
            if (userCoords) {
                distance = calculateDistance(settings.storeLat, settings.storeLon, userCoords.lat, userCoords.lon);
                shippingCost = Math.round((distance * settings.costPerKm) / 1000) * 1000; 
                if (shippingCost < 0) shippingCost = 0; 
                if (totalQty >= 5) shippingCost = 0;
            }

            const grandTotal = itemsTotal + shippingCost;

            const handleGetLocation = () => {
                setIsLoadingLoc(true);
                if ("geolocation" in navigator) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            setUserCoords({ lat: position.coords.latitude, lon: position.coords.longitude });
                            setIsLoadingLoc(false);
                        },
                        (error) => {
                            console.warn("Geolocation error, using mock location.");
                            setUserCoords({ lat: settings.storeLat + 0.05, lon: settings.storeLon + 0.05 });
                            showAlert("Yah, izin lokasinya ditolak nih. Kita pakai lokasi bohongan dulu ya buat nyobain fiturnya!", "😅");
                            setIsLoadingLoc(false);
                        },
                        { timeout: 5000 }
                    );
                } else {
                    showAlert("Browser kamu nggak support baca lokasi nih 😭", "😥");
                    setIsLoadingLoc(false);
                }
            };

            const handleCheckout = () => {
                if (!name || !phone) return showAlert("Eh tunggu! Nama & No HP belum diisi nih. Nanti kurirnya bingung nyariin kamu~", "🥺");
                if (!userCoords) return showAlert("Ups! Kasih tau lokasi kamu dulu dong biar kita gampang ngirimnya~", "📍");
                if (cart.length === 0) return showAlert("Keranjangnya masih kosong melompong nih. Jajan dulu yuk!", "🛒");

                if (payment === 'QRIS') {
                    setQrisModal(true);
                    return; 
                }

                processOrder();
            };

            const processOrder = async () => {
                const newOrder = {
                    id: 'ORD-' + Math.floor(Math.random() * 10000),
                    date: new Date().toISOString(),
                    customerName: name,
                    phone: phone,
                    items: cart, 
                    itemsTotal,
                    shippingCost,
                    grandTotal,
                    paymentMethod: payment,
                    status: payment === 'QRIS' ? 'Menunggu Konfirmasi' : 'Pesanan Masuk', 
                    distance: distance.toFixed(2),
                    coords: userCoords
                };

                setOrders(prev => [newOrder, ...prev]);
                
                const { error } = await supabase.from('orders').insert([newOrder]);
                
                if (error) {
                    console.error("Gagal simpan pesanan:", error);
                    showAlert("Duh, gagal menyimpan pesanan ke server nih. Pastikan URL & Key Supabase sudah benar ya!", "😢", null);
                } else {
                    showAlert("Yey! Pesanan berhasil dibuat. Tunggu camilan manismu sampai yaa!", "🎉", null);
                    onCheckoutSuccess();
                }
            };

            if (cart.length === 0) {
                return (
                    <div className="clay-card text-center py-16 px-6 my-4">
                        <div className="w-24 h-24 mx-auto mb-5 clay-bubble flex items-center justify-center text-6xl animate-pulse">
                            🛒
                        </div>
                        <p className="font-black text-xl clay-title">Keranjang masih kosong nih!</p>
                        <p className="text-sm font-bold mt-1 text-stone-500">Yuk, pesan cemilan manismu sekarang!</p>
                    </div>
                );
            }

            return (
                <div className="space-y-4 pb-10">
                    <div className="clay-card p-3.5 flex items-center justify-between">
                        <h2 className="font-black text-xl clay-title flex items-center gap-2">
                            <span className="clay-orange w-9 h-9 rounded-xl flex items-center justify-center text-white">
                                <Icon name="shopping-bag" size={18} />
                            </span>
                            Pesananku
                        </h2>
                        <span className="clay-yellow px-3 py-1 rounded-full text-xs font-black">
                            {totalQty} Box
                        </span>
                    </div>
                    
                    {/* Daftar Item di Keranjang */}
                    <div className="clay-card p-4 space-y-3">
                        {cart.map(item => (
                            <div key={item.id} className="clay-card-warm p-3.5 flex justify-between items-center gap-2">
                                <div className="flex items-center gap-3">
                                    <span className="text-2xl clay-bubble w-12 h-12 flex items-center justify-center shrink-0">
                                        {item.imgId}
                                    </span>
                                    <div>
                                        <h4 className="font-black text-sm clay-title uppercase">{item.name}</h4>
                                        <div className="flex items-center gap-2 mt-1.5">
                                            <button 
                                                onClick={() => {
                                                    if(item.qty > 1) setCart(cart.map(i => i.id === item.id ? {...i, qty: i.qty-1} : i));
                                                    else setCart(cart.filter(i => i.id !== item.id));
                                                }} 
                                                className="clay-gray w-8 h-8 rounded-lg flex items-center justify-center font-black clay-btn"
                                            >

                                            <span className="font-black text-sm w-6 text-center clay-title">{item.qty}</span>

                                                onClick={() => setCart(cart.map(i => i.id === item.id ? {...i, qty: i.qty+1} : i))} 
                                                className="clay-yellow w-8 h-8 rounded-lg flex items-center justify-center font-black clay-btn"
                                            >
                                                +
                                            </button>
                                        </div>
                                    </div>
                                </div>
                                <span className="font-black text-base clay-price-text shrink-0">
                                    {formatRp(item.price * item.qty)}
                                </span>
                            </div>
                        ))}

                    {/* Form Data Diri & Pengiriman */}

                const { error } = await supabase.from('orders').update({ status: newStatus }).eq('id', id);

                showAlert("Beneran mau hapus pesanan ini? Nanti datanya nggak bisa balik lho!", "🗑️", async () => {
                    setOrders(orders.filter(o => o.id !== id));
                    
                    const { error } = await supabase.from('orders').delete().eq('id', id);
                    if (error) {
                        console.error("Gagal menghapus pesanan:", error);
                        showAlert("Gagal menghapus pesanan di server.", "😢");
                    }
                });
            };

            const openGoogleMaps = (coords) => {
                if(!coords) return showAlert("Lokasi pelanggan belum ada nih.", "🗺️");
                const url = `https://www.google.com/maps/dir/?api=1&origin=${settings.storeLat},${settings.storeLon}&destination=${coords.lat},${coords.lon}`;
                window.open(url, '_blank');
            };

            const getWaLink = (phone) => {
                if (!phone) return '#';
                let cleaned = phone.replace(/\D/g, '');
                if (cleaned.startsWith('0')) {
                    cleaned = '62' + cleaned.substring(1);
                }
                return `https://wa.me/${cleaned}`;
            };

            const STATUS_OPTIONS = [
                'Menunggu Konfirmasi', 'Pesanan Masuk', 'Sedang Diproses', 'Sedang Dikirim', 'Selesai', 'Dibatalkan'
            ];

            return (
                <div className="space-y-4">
                    <div className="flex justify-between items-center clay-card p-4">
                        <h2 className="font-black text-lg clay-title flex items-center gap-2">
                            <Icon name="list" size={18}/> Pesanan ({orders.length})
                        </h2>
                        <button 
                            onClick={handleRefresh} 
                            disabled={isRefreshing}
                            className={`px-4 py-2 rounded-full font-extrabold text-xs flex items-center gap-2 clay-btn ${
                                isRefreshing ? 'clay-gray text-stone-400' : 'clay-yellow'
                            }`}
                        >
                            <Icon name="refresh-cw" size={14} className={isRefreshing ? "animate-spin" : ""} /> 
                            {isRefreshing ? 'Memuat...' : 'Refresh'}
                        </button>
                    </div>

                    {orders.length === 0 ? (
                        <div className="text-center p-12 clay-card">
                            <span className="text-5xl block mb-2">📭</span>
                            <p className="text-stone-500 text-sm font-bold">Belum ada pesanan masuk.</p>
                        </div>
                    ) : null}
                    
                    {/* Order Cards styled like BLEACHING / COLOUR cards in Reference Image 1 */}
                    {orders.map(order => (
                        <div key={order.id} className="clay-card-accent-green p-5 relative overflow-hidden space-y-3.5">
                            <div className="flex justify-between items-start pb-3 clay-divider">
                                <div className="flex items-start gap-3 pr-2">
                                    <div className="clay-bubble w-12 h-12 flex items-center justify-center text-2xl shrink-0">
                                        📦
                                    </div>
                                    <div>
                                        <h3 className="font-black clay-title text-lg uppercase leading-tight">{order.customerName}</h3>
                                        <div className="flex flex-wrap items-center gap-1.5 mt-1.5">
                                            <span className="clay-red px-2.5 py-0.5 rounded-full text-[10px] font-extrabold uppercase">
                                                {order.paymentMethod}
                                            </span>
                                            <span className="clay-mint px-2.5 py-0.5 rounded-full text-[10px] font-extrabold uppercase">
                                                ● {order.status}
                                            </span>
                                        </div>
                                        <a 
                                            href={getWaLink(order.phone)}
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            className="text-xs font-mono text-emerald-800 hover:underline font-extrabold flex items-center gap-1 mt-2"
                                        >
                                            <Icon name="message-circle" size={13} /> {order.phone}
                                        </a>
                                    </div>
                                </div>

                                {/* Putty-Clay Square Delete Button (like Trash button in Reference Image 1) */}
                                <button 
                                    onClick={() => handleDelete(order.id)}
                                    className="clay-gray hover:text-red-600 rounded-xl w-10 h-10 flex items-center justify-center shrink-0 clay-btn"
                                    title="Hapus Pesanan"
                                >
                                    <Icon name="trash-2" size={16} />
                                </button>
                            </div>

                            {/* Pricing & Time Rows like Reference Image 1 ("Harga" & "Durasi") */}
                            <div className="space-y-1.5 text-sm">
                                <div className="flex justify-between items-center font-bold">
                                    <span className="text-stone-600 flex items-center gap-1.5">💵 Total Bayar</span>
                                    <span className="font-black text-lg clay-price-text">{formatRp(order.grandTotal)}</span>
                                </div>
                                <div className="flex justify-between items-center font-bold text-xs">
                                    <span className="text-stone-600 flex items-center gap-1.5">🕒 Waktu Pesan</span>
                                    <span className="font-extrabold text-stone-800">{new Date(order.date).toLocaleString('id-ID')}</span>
                                </div>
                            </div>

                            {/* Yellow Extruded Box for Order Items (like "% Komisi" bar in Reference Image 1) */}
                            <div className="clay-yellow p-3.5 rounded-xl text-sm space-y-1">
                                <p className="font-black text-xs uppercase tracking-wider mb-1 opacity-80">Detail Item:</p>
                                {order.items.map(item => (
                                    <div key={item.id} className="flex justify-between font-extrabold text-mayumi-brown">
                                        <span><span className="clay-price-text font-black">{item.qty}x</span> {item.name}</span>
                                    </div>
                                ))}
                                <div className="border-t border-amber-700/20 mt-2 pt-1.5 flex justify-between text-xs font-extrabold">
                                    <span>🛵 Ongkir ({order.distance}km):</span>
                                    <span>{formatRp(order.shippingCost)}</span>
                                </div>
                            </div>

                            {order.coords && (
                                <button 
                                    onClick={() => openGoogleMaps(order.coords)}
                                    className="w-full clay-gray py-2.5 rounded-xl font-extrabold text-xs flex items-center justify-center gap-2 clay-btn"
                                >
                                    <Icon name="map" size={15} /> Lacak Rute di Maps
                                </button>
                            )}

                            <div className="flex items-center gap-2.5 pt-2 clay-divider">
                                <span className="text-xs font-extrabold text-stone-600">Status:</span>
                                <select 
                                    value={order.status}
                                    onChange={(e) => updateStatus(order.id, e.target.value)}
                                    className="flex-1 text-xs sm:text-sm clay-inset p-2.5 rounded-xl font-extrabold text-mayumi-brown"
                                >
                                    {STATUS_OPTIONS.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                                </select>
                            </div>
                        </div>
                    ))}
                </div>
            );
        };

        const AdminSettings = ({ settings, setSettings, products, setProducts, showAlert }) => {
            const [localSet, setLocalSet] = useState(settings);
            const [localProducts, setLocalProducts] = useState(products);
            const [isSavingStore, setIsSavingStore] = useState(false);
            
            // State untuk kelola Modal Produk
            const [showProdModal, setShowProdModal] = useState(false);
            const [editForm, setEditForm] = useState(null);

            // 1. Simpan Pengaturan Toko (Ongkir & GPS)
            const handleSaveSettings = async () => {
                setIsSavingStore(true);
                try {
                    const { error } = await supabase.from('settings').update({
                        storeLat: localSet.storeLat,
                        storeLon: localSet.storeLon,
                        costPerKm: localSet.costPerKm
                    }).eq('id', 1);

                    if (error) throw error;
                    setSettings(localSet);
                    showAlert('Pengaturan Lokasi & Ongkir berhasil disimpan!', '🎉');
                } catch (error) {
                    console.error("Error saving settings:", error);
                    showAlert('Gagal menyimpan pengaturan!', '😢');
                } finally {
                    setIsSavingStore(false); 
                }
            };

            const handleGetAdminLocation = () => {
                if ("geolocation" in navigator) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            setLocalSet({
                                ...localSet,
                                storeLat: position.coords.latitude,
                                storeLon: position.coords.longitude
                            });
                        },
                        (error) => showAlert("Yah gagal ngambil lokasi dari GPS nih.", "😢")
                    );
                }
            };

            // 2. Fungsi Tambah/Edit/Hapus Produk
            const openAddProduct = () => {
                const newId = localProducts.length > 0 ? Math.max(...localProducts.map(p => p.id)) + 1 : 1;
                setEditForm({ id: newId, name: '', price: '', desc: '', imgId: '🍌' });
                setShowProdModal(true);
            };

            const openEditProduct = (p) => {
                setEditForm(p);
                setShowProdModal(true);
            };

            const handleDeleteProduct = (id) => {
                showAlert("Yakin mau hapus menu ini? Nanti hilang permanen lho!", "🗑️", async () => {
                    const updatedList = localProducts.filter(p => p.id !== id);
                    setLocalProducts(updatedList);
                    setProducts(updatedList);
                    
                    const { error } = await supabase.from('products').delete().eq('id', id);
                    if (error) showAlert(`Gagal Hapus (Database Error): ${error.message}`, "😢");
                });
            };

            const handleSaveProduct = async () => {
                if(!editForm.name || !editForm.price) return showAlert("Nama dan Harga harus diisi ya!", "⚠️");
                
                const price = Number(editForm.price);
                const label = price >= 1000 ? (price / 1000) + 'K' : price.toString();
                
                // Mencegah error jika deskripsi kosong
                const payload = { 
                    ...editForm, 
                    price, 
                    label,
                    desc: editForm.desc ? editForm.desc : null 
                };
                
                const { error } = await supabase.from('products').upsert([payload]);
                
                if (error) {
                    console.error("Upsert error:", error);
                    return showAlert(`Gagal simpan: ${error.message}`, "😢");
                }
                
                const exists = localProducts.find(p => p.id === payload.id);
                const newList = exists 
                    ? localProducts.map(p => p.id === payload.id ? payload : p)
                    : [...localProducts, payload];
                
                const sortedList = newList.sort((a,b) => a.id - b.id);
                
                setLocalProducts(sortedList);
                setProducts(sortedList);
                setShowProdModal(false);
                showAlert("Berhasil memperbarui menu!", "✅");
            };

            return (
                <div className="space-y-5">
                    {/* Panel 1: Pengaturan Lokasi & Ongkir */}
                    <div className="clay-card p-5">
                        <h2 className="font-black text-xl clay-title pb-3 mb-4 clay-divider">
                            Pengaturan Toko ⚙️
                        </h2>
                        
                        <div>
                            <label className="block text-xs font-extrabold text-stone-600 mb-2 uppercase">Tarif Ongkir / Km (Rp)</label>
                            <input 
                                type="number" 
                                value={localSet.costPerKm} 
                                onChange={(e) => setLocalSet({...localSet, costPerKm: Number(e.target.value)})}
                                className="w-full p-3.5 clay-inset font-bold text-mayumi-brown"
                            />
                        </div>

                        <div className="pt-4">
                            <label className="block text-xs font-extrabold text-stone-600 mb-2 uppercase">Koordinat Toko (Base Lokasi)</label>
                            <div className="flex gap-2.5 mb-3 w-full">
                                <input 
                                    type="number" 
                                    step="any" 
                                    placeholder="Latitude" 
                                    value={localSet.storeLat} 
                                    onChange={(e) => setLocalSet({...localSet, storeLat: Number(e.target.value)})} 
                                    className="w-full min-w-0 flex-1 p-3.5 clay-inset text-sm font-bold text-mayumi-brown" 
                                />
                                <input 
                                    type="number" 
                                    step="any" 
                                    placeholder="Longitude" 
                                    value={localSet.storeLon} 
                                    onChange={(e) => setLocalSet({...localSet, storeLon: Number(e.target.value)})} 
                                    className="w-full min-w-0 flex-1 p-3.5 clay-inset text-sm font-bold text-mayumi-brown" 
                                />
                            </div>
                            <button 
                                onClick={handleGetAdminLocation} 
                                className="w-full text-sm clay-gray py-3.5 rounded-xl font-extrabold flex items-center justify-center gap-2 clay-btn"
                            >
                                <Icon name="map-pin" size={16} /> Gunakan GPS Saat Ini
                            </button>
                        </div>
                        
                        <button 
                            onClick={handleSaveSettings} 
                            disabled={isSavingStore}
                            className={`w-full mt-5 text-white font-black text-base py-4 rounded-full clay-btn flex justify-center items-center gap-2 ${
                                isSavingStore ? 'clay-gray text-stone-400 cursor-not-allowed' : 'clay-orange'
                            }`}
                        >
                            {isSavingStore ? <><Icon name="loader" size={20} className="animate-spin" /> MENYIMPAN...</> : 'SIMPAN PENGATURAN'}
                        </button>
                    </div>

                    {/* Panel 2: Kelola Menu (Styled like Service Cards in Reference Image 1) */}
                    <div className="clay-card p-5">
                        <div className="flex justify-between items-center pb-3 mb-4 clay-divider">
                            <h2 className="font-black text-xl clay-title">Kelola Menu 🍕</h2>
                            <span className="clay-mint px-3 py-1 rounded-full text-xs font-extrabold">
                                ● {localProducts.length} AKTIF
                            </span>
                        </div>
                        
                        <div className="space-y-3.5 mb-5">
                            {localProducts.map((product, idx) => (
                                <div key={product.id} className={`${idx % 2 === 0 ? 'clay-card-accent-green' : 'clay-card-warm'} p-4 space-y-3`}>
                                    <div className="flex justify-between items-start pb-2.5 clay-divider">
                                        <div className="flex items-center gap-3">
                                            <span className="text-2xl clay-bubble w-12 h-12 flex items-center justify-center shrink-0">
                                                {product.imgId}
                                            </span>
                                            <div>
                                                <h4 className="font-black clay-title text-base uppercase">{product.name}</h4>
                                                <div className="flex gap-1.5 mt-1">
                                                    <span className="clay-red px-2.5 py-0.5 rounded-full text-[10px] font-extrabold uppercase">
                                                        MENU
                                                    </span>
                                                    <span className="clay-mint px-2.5 py-0.5 rounded-full text-[10px] font-extrabold uppercase">
                                                        ● AKTIF
                                                    </span>
                                                </div>
                                            </div>
                                        </div>
                                        <div className="text-right">
                                            <span className="text-[10px] font-bold text-stone-500 block">Harga</span>
                                            <p className="text-base clay-price-text font-black">Rp {product.price.toLocaleString('id-ID')}</p>
                                        </div>
                                    </div>

                                    {/* Bottom row with ID order & Putty Square Action Buttons (exact match to Reference Image 1) */}
                                    <div className="flex justify-between items-center pt-0.5">
                                        <span className="text-xs font-extrabold text-stone-600 flex items-center gap-1">
                                            <span className="w-4 h-4 rounded-full clay-orange text-white inline-flex items-center justify-center text-[10px]">i</span>
                                            Urutan: {product.id}
                                        </span>
                                        <div className="flex gap-2">
                                            <button 
                                                onClick={() => openEditProduct(product)} 
                                                className="clay-gray w-10 h-10 rounded-xl flex items-center justify-center clay-btn"
                                                title="Edit Menu"
                                            >
                                                <Icon name="edit-2" size={16} />
                                            </button>
                                            <button 
                                                onClick={() => handleDeleteProduct(product.id)} 
                                                className="clay-gray hover:text-red-600 w-10 h-10 rounded-xl flex items-center justify-center clay-btn"
                                                title="Hapus Menu"
                                            >
                                                <Icon name="trash-2" size={16} />
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>

                        <button 
                            onClick={openAddProduct}
                            className="w-full clay-yellow font-black py-4 rounded-xl clay-btn flex justify-center items-center gap-2"
                        >
                            <Icon name="plus" size={18}/> Tambah Menu Baru
                        </button>
                    </div>

                    {/* Modal Tambah/Edit Produk */}
                    {showProdModal && editForm && (
                        <div className="fixed inset-0 bg-stone-950/60 backdrop-blur-sm z-[200] flex items-center justify-center p-4">
                            <div className="clay-card p-6 max-w-sm w-full relative space-y-4">
                                <button 
                                    onClick={() => setShowProdModal(false)} 
                                    className="absolute top-4 right-4 clay-gray rounded-xl w-9 h-9 flex items-center justify-center font-extrabold clay-btn"
                                >
                                    ✕
                                </button>
                                <h3 className="font-black text-xl clay-title pb-2 clay-divider">
                                    {localProducts.find(p=>p.id === editForm.id) ? 'Edit Menu 📝' : 'Tambah Menu 🆕'}
                                </h3>
                                
                                <div className="space-y-3.5">
                                    <div>
                                        <label className="text-xs font-extrabold text-stone-600 block mb-1">Nama Menu</label>
                                        <input 
                                            type="text" 
                                            value={editForm.name} 
                                            onChange={e=>setEditForm({...editForm, name: e.target.value})} 
                                            className="w-full p-3 clay-inset text-sm font-bold text-mayumi-brown" 
                                            placeholder="Contoh: Coklat Keju" 
                                        />
                                    </div>
                                    <div className="flex gap-2.5">
                                        <div className="flex-1">
                                            <label className="text-xs font-extrabold text-stone-600 block mb-1">Harga (Rp)</label>
                                            <input 
                                                type="number" 
                                                value={editForm.price} 
                                                onChange={e=>setEditForm({...editForm, price: e.target.value})} 
                                                className="w-full p-3 clay-inset text-sm font-bold text-mayumi-brown" 
                                                placeholder="14000" 
                                            />
                                        </div>
                                        <div className="w-24">
                                            <label className="text-xs font-extrabold text-stone-600 block mb-1">Emoji</label>
                                            <input 
                                                type="text" 
                                                value={editForm.imgId} 
                                                onChange={e=>setEditForm({...editForm, imgId: e.target.value})} 
                                                className="w-full p-3 clay-inset text-sm text-center font-bold text-mayumi-brown" 
                                            />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-xs font-extrabold text-stone-600 block mb-1">Deskripsi Pendek (Opsional)</label>
                                        <input 
                                            type="text" 
                                            value={editForm.desc || ''} 
                                            onChange={e=>setEditForm({...editForm, desc: e.target.value})} 
                                            className="w-full p-3 clay-inset text-sm font-bold text-mayumi-brown" 
                                            placeholder="Misal: (Mix 2 varian)" 
                                        />
                                    </div>
                                </div>

                                <button 
                                    onClick={handleSaveProduct} 
                                    className="w-full clay-green text-white font-black py-3.5 mt-2 rounded-full clay-btn"
                                >
                                    Simpan Menu
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    
</body>
</html>
